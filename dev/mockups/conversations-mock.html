  .ncm-app .ncm-conv__check { display: flex !important; align-items: flex-start; gap: 8px; margin: 0; text-transform: none !important; font-family: var(--ncm-font-body) !important; font-weight: 400 !important; font-size: calc(13px * var(--ncm-text-scale, 1)) !important; line-height: 1.3; color: var(--ncm-text-primary) !important; cursor: pointer; }
  .ncm-app .ncm-conv__check input { --checkbox-size: 14px; flex: none; width: 14px !important; height: 14px !important; margin: 2px 0 0 !important; }

  /* Admin → Messages → Conversations */

  .ncm-app label.ncm-conv__asearch { flex: 1 1 160px; min-width: 120px; display: flex; align-items: center; gap: 6px; margin: 0; padding: 0 8px; height: 28px; border: 1px solid var(--ncm-border); border-radius: 2px; background: var(--ncm-bg-card); text-transform: none; color: var(--ncm-text-label); }
  .ncm-app label.ncm-conv__asearch input { flex: 1; min-width: 0; height: 26px !important; min-height: 0 !important; padding: 0 !important; border: 0 !important; background: none !important; box-shadow: none !important; color: var(--ncm-text-heading) !important; font: 13px var(--ncm-font-body) !important; text-align: left !important; }
  .ncm-app label.ncm-conv__asearch input::placeholder { color: var(--ncm-text-hint); opacity: 1; }
  .ncm-app label.ncm-conv__asel { flex: none; display: inline-flex; align-items: center; gap: 5px; margin: 0; font: 700 10px var(--ncm-font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--ncm-text-label); }

  .ncm-app .ncm-conv__arowtx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .ncm-app .ncm-conv__arowtx b { font: 700 13px var(--ncm-font-display); color: var(--ncm-text-heading, var(--ncm-text-primary)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ncm-app .ncm-conv__arowtx small { font: 12px var(--ncm-font-body); color: var(--ncm-text-label, var(--ncm-text-secondary)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ncm-app .ncm-conv__alias.is-secret { color: color-mix(in oklab, var(--ncm-secret, var(--ncm-purple, #c9a0ff)) var(--ncm-ink, 65%), var(--ncm-text-heading, var(--ncm-text-primary))); }
  .ncm-app .ncm-conv__asb { color: var(--ncm-text-primary); }
  .ncm-app .ncm-conv__asnote { margin-left: auto; font-family: var(--ncm-font-body); color: var(--ncm-text-secondary); }

<body>
<div class="mk-bar" id="mk-bar"></div>
<div class="mk-win" id="mk-win"></div>
<div id="mk-report"></div>

<script>
const q = new URLSearchParams(location.search);
const STATE = q.get('state') || 'chat';
const STATES = [['chat', 'Conversation open'], ['share', 'A shared contact arrives'], ['sharepick', 'Sharing a contact'], ['taplog', 'A tap log'], ['pill', 'Conversations pill'], ['mail', 'Mail open (unchanged)'], ['members', 'Members'], ['add', 'Add someone'], ['new', 'New conversation'], ['alias', 'In it as an alias'], ['removed', 'You were removed'], ['nogm', 'No GM online'], ['notify', 'Notifications'], ['notifygm', 'Notifications (GM)'], ['gm', 'GM speaking as an NPC'], ['admin', 'Admin: an NPC chat'], ['adminwatch', 'Admin: watching players'], ['adminmembers', 'Admin: members']];
const IS_ADMIN = STATE.startsWith('admin');
document.getElementById('mk-bar').innerHTML = STATES.map(([k, l]) => { const p = new URLSearchParams(location.search); p.set('state', k); return `<a href="?${p}" class="${k === STATE ? 'on' : ''}">${l}</a>`; }).join('');

const PEOPLE = {
  me: { name: 'V', i: 'V', c: '#19f3f7', addr: 'v@nightcity.net' },
  rache: { name: 'Rache', i: 'R', c: '#ff5fa2', addr: 'rache@nightcity.net' },
  nix: { name: 'Nix', i: 'N', c: '#5ad1ff', addr: 'nix@darknet.nc' },
  kestrel: { name: 'Kestrel', i: 'K', c: '#b4e05a', addr: 'kestrel@nightcity.net' },
  mox: { name: 'Mox', i: 'M', c: '#ffb347', addr: 'mox@afterdark.nc' },
  hask: { name: 'Hask', i: 'H', c: '#c9a0ff', addr: 'hask@nightcity.net' },
  hr: { name: 'Arasaka HR', i: 'A', c: '#9aa7b5', addr: 'hr@arasaka.corp' },
  tap: { name: 'TAP · Kabuki relay', i: 'T', c: '#c9a0ff', addr: '' },
  silver: { name: 'Silver', i: 'S', c: '#c9a0ff', addr: 'silver@burner.nc' },
  v: { name: 'V', i: 'V', c: '#19f3f7', addr: 'v@nightcity.net' },
};
const av = (id) => { const p = PEOPLE[id]; return `<div class="ncm-conv__av" style="--c:${p.c}">${p.i}</div>`; };

const CARDS = {
  dao: { name: 'Doc Dao', i: 'D', c: '#5ad1ff', role: 'Ripperdoc', email: 'dao@watson-clinic.nc', phone: 'WAT-2208' },
  mox: { name: 'Mox', i: 'M', c: '#ffb347', role: 'Fixer', email: 'mox@afterdark.nc', phone: 'KAB-3301' },
  hask: { name: 'Hask', i: 'H', c: '#c9a0ff', role: 'Solo', email: 'hask@nightcity.net', phone: '' },
};
const CARD_LINE = { from: 'rache', time: '10:03', card: { ...CARDS.dao } };
let conv = {
  title: 'Dockside crew', starter: 'rache', members: ['me', 'rache', 'nix', 'kestrel'],
  lines: [
    { day: 'Tue 14 Aug 2045' },
    { from: 'rache', time: '21:12', text: 'Client moved the meet up. Thursday, not Friday. Everyone still in?' },
    { from: 'me', time: '21:15', text: 'In. Need the dock layout before then.' },
    { from: 'nix', time: '21:31', text: 'I can pull the camera map off the harbour authority box.' },
    { from: 'nix', time: '21:31', text: 'Give me a night.' },
    { from: 'kestrel', time: '21:40', text: 'I have a van. Do we need more than a van?' },
    { from: 'me', time: '21:44', text: 'Depends what comes out of the container.' },
    { day: 'Wed 15 Aug 2045' },
    { sys: 'Rache added Kestrel', icon: 'fa-user-plus' },
    { fresh: '3 new' },
    { from: 'kestrel', time: '08:04', text: 'Plates are clean until Friday noon, after that I make no promises.' },
    { from: 'nix', time: '09:47', text: 'Got the map. Two blind spots on the east side.' },
    { from: 'nix', time: '09:47', img: true },
    { from: 'nix', time: '09:47', text: 'The second one moves with the patrol.' },
    { from: 'rache', time: '10:02', text: 'Which side do you want the van?' },
    ...(['chat', 'gm'].includes(STATE) ? [CARD_LINE] : []),
  ],
};

/* A shared contact: the Data Drop, small enough to live in the line. Plays once, when it arrives while the chat is open. */
function cardHtml(l, mine) {
  const c = l.card, from = mine ? 'You' : PEOPLE[l.from].name;
  const parts = [c.email ? `<span class="ncm-conv__dropv"><i class="fas fa-envelope"></i>${c.email}</span>` : '', c.phone ? `<span class="ncm-conv__dropv"><i class="fas fa-phone"></i>${c.phone}</span>` : ''].join('');
  const foot = mine ? '<span class="ncm-conv__dropdone"><i class="fas fa-check"></i> Shared with everyone here</span>'
    : l.saved ? '<span class="ncm-conv__dropdone is-saved"><i class="fas fa-circle-check"></i> In your contacts</span>'
    : `<button type="button" class="ncm-conv__btn ncm-conv__btn--go" data-save="${l.time}" data-tooltip="Adds them to your contacts. If you already have them, this only adds what you were missing"><i class="fas fa-user-plus"></i> Save contact</button>`;
  return `<div class="ncm-conv__drop${l.fresh2 ? ' is-fresh' : ''}${l.savedNow ? ' is-savednow' : ''}" style="--c:${c.c}">
    <div class="ncm-conv__droptop"><i class="fas fa-share-nodes"></i> Data Drop<span class="ncm-conv__droproute"><span class="dot">${from}</span><span class="wire"><span class="fill"></span></span><span class="dot">Everyone here</span></span></div>
    <div class="ncm-conv__dropbody"><span class="ncm-conv__sweep"></span><div class="ncm-conv__av ncm-conv__dropav" style="--c:${c.c}">${c.i}</div><div class="ncm-conv__dropinfo"><span class="ncm-conv__dropname">${c.name}</span><span class="ncm-conv__droprole">${c.role}</span>${parts}</div></div>
    <div class="ncm-conv__dropfoot">${foot}</div></div>`;
}

function linesHtml(lines) {
  let prev = null;
  return lines.map((l, idx) => {
    if (l.gone) { prev = null; return '<div class="ncm-conv__rule ncm-conv__rule--sys"><i class="fas fa-eraser"></i> Line removed by the GM</div>'; }
    if (l.day) { prev = null; return `<div class="ncm-conv__rule">${l.day}</div>`; }
    if (l.fresh) { prev = null; return `<div class="ncm-conv__rule ncm-conv__rule--new" data-fresh>${l.fresh}</div>`; }
    if (l.sys) { prev = null; return `<div class="ncm-conv__rule ncm-conv__rule--sys"><i class="fas ${l.icon}"></i> ${l.sys}</div>`; }
    const p = PEOPLE[l.from]; const mine = l.from === 'me'; const cont = prev === l.from; prev = l.from;
    const head = cont ? '' : `<div class="ncm-conv__who"><span class="ncm-conv__name">${mine ? 'You' : p.name}</span>${mine && STATE === 'alias' ? '<span class="ncm-conv__alias">as Silver</span>' : ''}${l.alias ? `<span class="ncm-conv__alias is-secret">${l.alias}</span>` : ''}${l.npc ? '<span class="ncm-conv__npc">NPC</span>' : ''}<span class="ncm-conv__time">${l.time}</span></div>`;
    const body = l.card ? cardHtml(l, mine) : l.img ? '<div class="ncm-conv__pic" role="img" aria-label="A shared image"></div>' : `<div class="ncm-conv__bubble"></div>`;
    const st = l.state ? `<div class="ncm-conv__state"><i class="fas ${l.state === 'Queued' ? 'fa-clock' : 'fa-check'}"></i>${l.state}</div>` : '';
    return `<article class="ncm-conv__m${mine ? ' is-mine' : ''}${cont ? ' is-cont' : ''}" data-text="${(l.text || '').replace(/"/g, '&quot;')}">${mine ? '' : (cont ? '<div></div>' : av(l.from))}<div style="min-width:0">${head}${body}${st}</div>${IS_ADMIN ? `<button type="button" class="ncm-conv__icon ncm-conv__rm" data-rmline="${idx}" aria-label="Remove this line" data-tooltip="Remove this line for everyone. A marker stays in its place"><i class="fas fa-eraser"></i></button>` : ''}</article>`;
  }).join('');
}
const fillText = (root) => root.querySelectorAll('[data-text]').forEach((a) => { const b = a.querySelector('.ncm-conv__bubble'); if (b) b.textContent = a.dataset.text; });

const names = () => conv.members.map((m) => (m === 'me' ? (STATE === 'alias' ? 'You (Silver)' : 'You') : PEOPLE[m].name)).join(', ');
let panelOpen = STATE === 'members' || STATE === 'add';
let muted = false, plusOpen = false;

function barHtml() {
  if (STATE === 'removed') return `<div class="ncm-conv__gone"><i class="fas fa-user-minus"></i> Rache removed you on 15 Aug. You can still read what you had, but nothing new will reach you.</div>`;
  const nogm = STATE === 'nogm';
  return `<div class="ncm-conv__bar">
    ${nogm ? '<div class="ncm-conv__alert"><i class="fas fa-triangle-exclamation"></i> No GM is online. Your lines wait here and send when one connects.</div>' : ''}
    ${STATE === 'gm' ? `<div class="ncm-conv__as"><span>Speaking as</span><button type="button" class="ncm-conv__btn" data-tooltip="Switch between the NPCs in this conversation"><i class="fas fa-masks-theater"></i> Mox <i class="fas fa-caret-down"></i></button></div>` : ''}
    ${STATE === 'alias' ? '<div class="ncm-conv__as"><i class="fas fa-mask"></i><span>You are in this as <b class="ncm-conv__asb">Silver</b>. Everyone here only ever sees Silver.</span></div>' : ''}
    <div class="ncm-conv__write">

    ${[['fa-reply', 'Needs a reply', 2, 'hot'], ['fa-envelopes-bulk', 'All mail', 412, ''], ['fa-comments', 'Conversations', 4, 'on'], ['fa-inbox', 'Inboxes', 23, ''], ['fa-paper-plane', 'Outbox', 3, '']].map(([ic, l, n, t]) => `<button type="button" class="ncm-msg2-navbtn${t === 'on' ? ' on' : ''}"><i class="fas ${ic}"></i>${l}<span class="ncm-msg2-ct ${t === 'hot' ? 'hot' : ''}">${n}</span></button>`).join('')}
  </div>
  <header class="ncm-tabhd"><i class="fas fa-comments"></i><div><h2>Conversations</h2><p>Every group chat in the world. Reading one is invisible: nobody is told, and nothing is marked read.</p></div></header>
  <div class="ncm-conv__atb"><label class="ncm-conv__asearch"><i class="fas fa-magnifying-glass"></i><input type="text" placeholder="Title or member" aria-label="Search conversations"></label>

function adminPaint() {
  const keep = (a) => adminShow === 'all' || (adminShow === 'wait' && a.wait) || (adminShow === 'npc' && a.npcs.length) || (adminShow === 'players' && !a.npcs.length);

/* ═══ Notifications: the rule, driven by real toast markup ═══ */
const NOTE = { open: false, muted: false, toast: null, heard: false, unreadConvs: new Set(), log: [] };
const say = (t) => { NOTE.log.unshift(t); NOTE.log = NOTE.log.slice(0, 9); const el = document.getElementById('mk-log'); if (el) el.innerHTML = NOTE.log.map((x) => `<li>${x}</li>`).join(''); };
const toastHost = () => { let c = document.querySelector('.ncm-toast-container'); if (!c) { c = document.createElement('div'); c.className = 'ncm-toast-container'; document.body.appendChild(c); } return c; };
function toastPaint(title, detail, icon = 'fas fa-comments') {
  const c = toastHost();
  if (!NOTE.toast) { NOTE.toast = document.createElement('div'); NOTE.toast.className = 'ncm-toast ncm-toast--info'; NOTE.toast.style.setProperty('--toast-color', 'var(--ncm-secondary)'); c.appendChild(NOTE.toast); }
  NOTE.toast.innerHTML = `<div class="ncm-toast__accent"></div><div class="ncm-toast__icon"><i class="${icon}"></i></div><div class="ncm-toast__body"><div class="ncm-toast__title">${title}</div><div class="ncm-toast__separator"></div><div class="ncm-toast__detail">${detail}</div></div>`;
  clearTimeout(NOTE.t); NOTE.t = setTimeout(() => { NOTE.toast?.remove(); NOTE.toast = null; say('Toast leaves by itself. The badge stays.'); }, 6000);
}
function badge() { const n = document.getElementById('mk-badge'); if (n) { n.textContent = NOTE.unreadConvs.size; n.style.display = NOTE.unreadConvs.size ? '' : 'none'; } }
let burstN = 0;
function line(who, gm) {
  if (NOTE.muted) { say(`${who} wrote. <b>Muted:</b> no toast, no sound, no badge.`); return; }
  if (NOTE.open) { say(`${who} wrote. <b>It's open:</b> the line just appears. No toast, no sound.`); return; }
  burstN += 1; NOTE.unreadConvs.add('crew'); badge();
  if (!NOTE.heard) { NOTE.heard = true; say(`${who} wrote. <b>First new line:</b> toast and one sound.`); }
  else say(`${who} wrote. <b>Same toast updates.</b> No new toast, no sound.`);
  if (gm) toastPaint('NPC conversations', `${burstN} waiting across 1 conversation`, 'fas fa-masks-theater');
  else toastPaint('Dockside crew', `${burstN} new · ${who}`);
}
function notifyControls(gm) {
  const box = document.createElement('div'); box.id = 'mk-notify';
  box.innerHTML = `<div class="mk-nh">Try it${gm ? ' (as the GM)' : ''}</div><button data-n="one">One line arrives</button><button data-n="burst">Six lines, fast</button><label><input type="checkbox" data-n="open"> Conversation is open</label><label><input type="checkbox" data-n="mute"> Conversation is muted</label><button data-n="read">Read it</button>
    <div class="mk-nh" style="margin-top:8px">Agent button</div><div class="mk-scene"><i class="fas fa-comments"></i><span class="ncm-unread-badge" id="mk-badge" style="display:none">0</span></div><div class="mk-nn">Counts conversations, never lines.</div>
    <div class="mk-nh" style="margin-top:8px">What happened</div><ul id="mk-log"></ul>`;
  document.body.appendChild(box);
  box.addEventListener('click', (e) => { const k = e.target.dataset?.n; if (k === 'one') line('Nix', gm); if (k === 'burst') ['Nix', 'Rache', 'Nix', 'Kestrel', 'Rache', 'Nix'].forEach((w, i) => setTimeout(() => line(w, gm), i * 220)); if (k === 'read') { NOTE.unreadConvs.clear(); NOTE.heard = false; burstN = 0; NOTE.toast?.remove(); NOTE.toast = null; clearTimeout(NOTE.t); badge(); say('Read. The next new line can make a sound again.'); } });
  box.addEventListener('change', (e) => { const k = e.target.dataset?.n; if (k === 'open') NOTE.open = e.target.checked; if (k === 'mute') { NOTE.muted = e.target.checked; if (NOTE.muted) { NOTE.unreadConvs.clear(); badge(); NOTE.toast?.remove(); NOTE.toast = null; } } });
}

  </div></div>
  <div class="ncm-viewer__split">

      <div class="ncm-viewer__msg-list ncm-scrollbar" id="list"></div>

    <div class="ncm-viewer__detail-panel" id="pane"></div>
  </div>
</div>`;
win.innerHTML = `<div class="ncm-app ${IS_ADMIN ? 'ncm-admin-panel' : 'ncm-message-viewer-window'}"${q.get('t') || IS_ADMIN ? ` data-ncm-admin-theme="${q.get('t') || 'clean-dark'}"` : ''}${q.get('scale') ? ` style="--ncm-text-scale:${q.get('scale')}"` : ''}>${inner}<div id="dlg"></div></div>`;

const pane = document.getElementById('pane') || document.getElementById('adminpane');
if (IS_ADMIN) {
  win.addEventListener('click', (ev) => {
    const rm = ev.target.closest('[data-rmline]');

    const r = ev.target.closest('[data-asel]');

    const a = adminConv(), k = t.dataset.aact;
    if (k === 'panel') adminPanel = !adminPanel;

    if (k === 'send') { const box = win.querySelector('.ncm-conv__input'), text = box.value.trim(); if (!text) return; a.lines.push({ from: a.npcs[adminAs % a.npcs.length], time: 'now', text, npc: true }); a.at = 'now'; delete a.wait; }
    adminPaint();
  });
  win.addEventListener('change', (ev) => { if (ev.target.id === 'ashow') { adminShow = ev.target.value; adminPaint(); } });
  win.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && ev.target.matches('textarea')) { ev.preventDefault(); win.querySelector('[data-aact="send"]')?.click(); } });
}
const dlg = document.getElementById('dlg');
let view = STATE === 'mail' ? 'mail' : STATE === 'taplog' ? 'tap' : 'chat';

function settle() {
  const s = pane.querySelector('[data-scroll]'); if (!s) return;
  fillText(s);
  const f = s.querySelector('[data-fresh]');
  s.scrollTop = f ? f.offsetTop - s.offsetTop - 6 : s.scrollHeight;
}
function paint() {
  if (IS_ADMIN) { adminPaint(); return; }
  pane.innerHTML = view === 'tap' ? tapHtml() : view === 'mail' ? mailHtml() : chatHtml();
  const list = document.getElementById('list'); if (list) list.innerHTML = listRows();
  settle();
}
paint();
if (STATE === 'new') dlg.innerHTML = newDlg();
if (STATE === 'add') dlg.innerHTML = addDlg();
if (STATE === 'sharepick') dlg.innerHTML = pickDlg();
const pushCard = (line) => { conv.lines.forEach((l) => { l.fresh2 = false; l.savedNow = false; }); conv.lines.push({ ...line, fresh2: true }); paint(); const sc = pane.querySelector('[data-scroll]'); sc.scrollTop = sc.scrollHeight; };
if (STATE === 'share') { document.getElementById('mk-bar').insertAdjacentHTML('beforeend', '<button type="button" id="mk-again" style="height:27px;width:auto;margin:0;padding:0 10px">Play it again</button>'); const fire = () => { conv.lines = conv.lines.filter((l) => !l.card); pushCard({ ...CARD_LINE, card: { ...CARDS.dao } }); }; setTimeout(fire, q.get('still') ? 0 : 500); document.getElementById('mk-again').addEventListener('click', fire); }
if (STATE === 'gm') { conv.members.push('mox'); conv.lines.push({ from: 'mox', time: '10:31', text: 'Half up front, as always.', npc: true }); paint(); }
if (STATE === 'notify' || STATE === 'notifygm') notifyControls(STATE === 'notifygm');
if (STATE === 'nogm') { conv.lines.push({ from: 'me', time: '10:05', text: 'East side. Bring the van round by the crane.', state: 'Queued' }); paint(); }

function addSys(text, icon) { conv.lines.push({ sys: text, icon }); }
win.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act],[data-remove],[data-add],[data-open],[data-save],[data-pickwho],[data-pickwhat]');
  if (plusOpen && !ev.target.closest('.ncm-conv__plus')) { plusOpen = false; paint(); }
  if (!t || IS_ADMIN) return;
  if (t.dataset.open) { view = t.dataset.open === 'mail' ? 'mail' : 'chat'; const lst = document.getElementById('list'); pane.innerHTML = view === 'mail' ? mailHtml() : chatHtml(); lst.querySelectorAll('.ncm-viewer__msg').forEach((r) => r.classList.toggle('ncm-viewer__msg--selected', r === t)); settle(); return; }
  if (t.dataset.save) { const l = conv.lines.find((x) => x.card && x.time === t.dataset.save); conv.lines.forEach((x) => { x.fresh2 = false; }); l.saved = true; l.savedNow = true; const top = pane.querySelector('[data-scroll]').scrollTop; paint(); pane.querySelector('[data-scroll]').scrollTop = top; return; }
  if (t.dataset.pickwho) { pickWho = t.dataset.pickwho; if (!CARDS[pickWho].phone) pickWhat = 'email'; dlg.innerHTML = pickDlg(); return; }
  if (t.dataset.pickwhat) { pickWhat = t.dataset.pickwhat; dlg.innerHTML = pickDlg(); return; }
  if (t.dataset.remove) { const n = PEOPLE[t.dataset.remove].name; conv.members = conv.members.filter((m) => m !== t.dataset.remove); addSys(`You removed ${n}`, 'fa-user-minus'); paint(); return; }
  if (t.dataset.add) { conv.members.push(t.dataset.add); addSys(`You added ${PEOPLE[t.dataset.add].name}`, 'fa-user-plus'); dlg.innerHTML = ''; paint(); return; }
  const scroll = pane.querySelector('[data-scroll]');
  switch (t.dataset.act) {
    case 'plus': plusOpen = !plusOpen; paint(); break;
    case 'pick': plusOpen = false; paint(); dlg.innerHTML = pickDlg(); break;
    case 'mynum': plusOpen = false; pushCard({ from: 'me', time: 'now', card: STATE === 'alias' ? { name: 'Silver', i: 'S', c: PEOPLE.silver.c, role: 'Alias', email: '', phone: 'BRN-7741' } : { name: 'V', i: 'V', c: PEOPLE.me.c, role: 'Solo', email: '', phone: 'WAT-4471' } }); break;
    case 'sharego': { const c = { ...CARDS[pickWho] }; if (pickWhat === 'email') c.phone = ''; if (pickWhat === 'number') c.email = ''; dlg.innerHTML = ''; pushCard({ from: 'me', time: 'now', card: c }); break; }
    case 'panel': panelOpen = !panelOpen; paint(); break;
    case 'add': dlg.innerHTML = addDlg(); break;
    case 'new': dlg.innerHTML = newDlg(); break;
    case 'close': dlg.innerHTML = ''; break;
    case 'mute': muted = !muted; paint(); break;
    case 'rename': conv.title = conv.title === 'Dockside crew' ? 'The Thursday job' : 'Dockside crew'; addSys(`You renamed this to ${conv.title}`, 'fa-pen'); paint(); break;
    case 'leave': conv.members = conv.members.filter((m) => m !== 'me'); addSys('You left', 'fa-right-from-bracket'); panelOpen = false; paint(); break;
    case 'earlier': t.textContent = 'Older lines load here'; break;
    case 'img': plusOpen = false; conv.lines.push({ from: 'me', time: 'now', img: true }); paint(); break;
    case 'asmail': { const b = t; b.innerHTML = '<i class="fas fa-envelope"></i> Opens the composer'; setTimeout(() => { b.innerHTML = '<i class="fas fa-envelope"></i> Send as mail'; }, 1800); break; }
    case 'send': {
      const box = pane.querySelector('.ncm-conv__input'); const text = box.value.trim(); if (!text) return;
      conv.lines.push({ from: 'me', time: 'now', text, state: STATE === 'nogm' ? 'Queued' : '' });

  }
});
if (!IS_ADMIN) win.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && ev.target.matches('textarea')) { ev.preventDefault(); pane.querySelector('[data-act="send"]')?.click(); } });
win.addEventListener('input', (ev) => { if (!ev.target.matches('.ncm-conv__input')) return; const el = ev.target; el.style.height = 'auto'; el.style.height = `${el.scrollHeight + 2}px`; });

// ── ?contrast=1: every text node in the window against what is really behind it ──
if (q.get('contrast')) {
  const run = () => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 1;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    const rgba = (c) => { cx.clearRect(0, 0, 1, 1); cx.fillStyle = '#000'; cx.fillStyle = c; cx.fillRect(0, 0, 1, 1); const d = cx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2], d[3] / 255]; };
    const lum = ([r, g, b]) => { const f = (v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
    const over = (t, u) => [0, 1, 2].map((i) => t[i] * t[3] + u[i] * (1 - t[3])).concat(1);
    const bgOf = (el) => { const st = []; for (let e = el; e; e = e.parentElement) { const c = rgba(getComputedStyle(e).backgroundColor); if (c[3] > 0) st.push(c); if (c[3] === 1) break; } let b = [21, 24, 26, 1]; for (const c of st.reverse()) b = over(c, b); return b; };
    const bad = new Map(); let n = 0;
    const w = document.createTreeWalker(win, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) {
      const t = w.currentNode; if (!t.textContent.trim()) continue;
      const el = t.parentElement; if (!el.offsetParent) continue; n++;
      const bg = bgOf(el); const fg = over(rgba(getComputedStyle(el).color), bg);
      const [a, b] = [lum(fg), lum(bg)].sort((x, y) => y - x); const r = (a + .05) / (b + .05);
      if (r < 4.5) { const k = String(el.className || el.tagName).split(' ')[0]; if (!bad.has(k) || bad.get(k) > r) bad.set(k, r); }
    }
    const list = [...bad].map(([k, r]) => `${r.toFixed(2)} ${k}`);
    const fresh = list.filter((l) => l.includes('ncm-conv'));
    document.title = `${n} nodes; new parts under 4.5: ${fresh.length}; shipped: ${list.length - fresh.length}`;
    document.getElementById('mk-report').textContent = `${document.title}\n${list.join('\n')}`;
  };
  document.fonts.ready.then(() => setTimeout(run, 300));
}
