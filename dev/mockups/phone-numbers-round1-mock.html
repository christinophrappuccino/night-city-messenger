  if (d.scope) { LIMITS.scope = d.scope; S.path = homePath(); S.level = null; S.sugg = []; return draw(); }
  if (d.camp) { const C = CAMPAIGNS[d.camp]; ROWS = [...ROWS.filter((r) => !C.rows.some((n) => rowKey(n) === rowKey(r))), ...C.rows.map((r) => ({ ...r }))]; setHome(C.home.rc, C.home.city); return draw(); }
  if (d.tb === 'blank') { const ex = [...COLS].map((c) => ({ 'Region code': '14', Region: 'Free State of Texas', State: 'Texas', 'City code': 'DAL', City: 'Dallas', Area: 'Downtown', Code: 'CEN', District: 'Central', Category: 'District', 'Players can pick': 'yes', Status: 'live', Source: 'Homebrew', Listed: 'yes' }[c])); const url = URL.createObjectURL(new Blob(['\uFEFF' + [COLS, ex].map((l) => l.map(csvCell).join(',')).join('\n')], { type: 'text/csv' })); const a = document.createElement('a'); a.href = url; a.download = 'ncm-phone-numbers-template.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000); return; }

/** Picking redraws only what changed, on the live page. That is the scroll fix: nothing replaces the scroller. */

}
function redrawPicker() {

/* hover help + number breakdown */
const tip = document.createElement('div'); tip.className = 'mk-tip'; tip.hidden = true; document.body.appendChild(tip);
let pop = null, popFor = null, pinned = false;
function closePop(force) { if (pinned && !force) return; pop?.remove(); pop = null; popFor = null; pinned = false; }
function openPop(el) {
  if (popFor === el) return;
  closePop(true);
  const raw = el.dataset.num, p = parse(raw);
  const rows = [];
  if (p.service) rows.push([p.service, 'Service', p.name, 'x']);
  else if (isUnlisted(p)) rows.push([p.ex || p.city, 'Unlisted', 'The directory has nothing on this number.', 'x']);
  else {
    rows.push([`+${p.rc}`, 'Region', REGIONS[p.rc].name, 'r']);
    if (stateOf(p)) rows.push(['', 'State', stateOf(p), 'c']);
    rows.push([p.city, 'City', REGIONS[p.rc].cities[p.city].name, 'c']);
    if (p.ex) rows.push([p.ex, 'District', REGIONS[p.rc].cities[p.city].ex[p.ex], 'x']);
    rows.push([p.line, 'Line', ownerOf(p) || 'Not in your contacts', 'l']);
  }
  pop = document.createElement('div'); pop.className = 'ncm-numpop ncm-num'; pop.style.cursor = 'default'; pop.style.whiteSpace = 'normal'; pop.style.borderBottom = '';
  pop.innerHTML = `<div class="ncm-numpop__n">${p.service ? esc(p.service) : isUnlisted(p) ? esc(raw) : esc(fullForm(p))}</div>${rows.map(([c, k, v, cls]) => `<div class="ncm-numpop__row"><code class="${cls}">${esc(c)}</code><small>${k}</small><span>${esc(v)}</span></div>`).join('')}<div class="ncm-numpop__ft">${p.service ? 'A word you can dial from anywhere.' : isUnlisted(p) ? 'It may still connect, if you dare.' : 'Where this number was issued. They may be somewhere else now.'}</div>`;
  document.body.appendChild(pop); popFor = el;
  const r = el.getBoundingClientRect(), pr = pop.getBoundingClientRect();
  pop.style.left = `${Math.max(8, Math.min(r.left, innerWidth - pr.width - 8))}px`;
  pop.style.top = `${r.bottom + pr.height + 8 > innerHeight ? Math.max(8, r.top - pr.height - 6) : r.bottom + 6}px`;
}
document.addEventListener('mouseover', (e) => {
  const n = e.target.closest?.('[data-num]');
  if (n) { tip.hidden = true; if (!pinned) openPop(n); return; }
  if (pop && !e.target.closest?.('.ncm-numpop') && !pinned) closePop();
  const t = e.target.closest?.('[data-tooltip]');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tooltip; tip.hidden = false;
  const r = t.getBoundingClientRect(), pr = tip.getBoundingClientRect();
  tip.style.left = `${Math.max(6, Math.min(r.left + r.width / 2 - pr.width / 2, innerWidth - pr.width - 6))}px`;
  tip.style.top = `${r.top - pr.height - 6 < 4 ? r.bottom + 6 : r.top - pr.height - 6}px`;
});
document.addEventListener('click', (e) => { if (e.target.closest?.('[data-linetoggle], [data-line]')) return; const n = e.target.closest?.('[data-num]'); if (n) { openPop(n); pinned = true; return; } if (!e.target.closest?.('.ncm-numpop')) closePop(true); });
document.addEventListener('focusin', (e) => { if (e.target.matches?.('[data-num]') && !pinned) openPop(e.target); });
document.addEventListener('focusout', (e) => { if (e.target.matches?.('[data-num]') && !pinned) closePop(); });

/* the two looks */
function applyTheme(t) {
  const R = document.documentElement.style;
  const on = t === 'arasaka';
  const set = { '--ncm-primary': '#ff2d3f', '--ncm-secondary': '#ff2d3f', '--ncm-accent': '#ffb347', '--ncm-bg-deep': '#0a0406', '--ncm-bg-base': '#100608', '--ncm-bg-surface': '#190a0d', '--ncm-bg-elevated': '#241014', '--ncm-border': '#4a2028', '--ncm-text-primary': '#f4e9ea', '--ncm-text-secondary': '#c9b4b7' };
  for (const [k, v] of Object.entries(set)) { if (on) R.setProperty(k, v); else R.removeProperty(k); }
  document.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
}

/* start */
const startS = q.get('s'); document.documentElement.style.setProperty('--ncm-text-scale', String((Number(startS) || 100) / 100));
document.querySelector(`[data-s="${startS === '130' ? 130 : 100}"]`).classList.add('on');
