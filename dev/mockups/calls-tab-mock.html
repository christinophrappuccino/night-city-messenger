<style>
  body { background: #07080c; margin: 0; padding: 26px; color: #c9d3e0; font-family: var(--ncm-font-body, sans-serif); }

    text-shadow: 0 0 6px color-mix(in srgb, var(--hs) 50%, transparent); }

  .dl__num .val .car { display: inline-block; width: 9px; height: 19px; background: var(--hs); vertical-align: -3px; margin-left: 2px; animation: blink .9s steps(2) infinite; }

  .dl__match .face { width: 18px; height: 18px; border-radius: 50%; background: center/cover; border: 1px solid var(--hs); }
  /* keypad: cut-corner keys */

  .dl__keys button { height: 38px; background: var(--bg3) !important; border: 1px solid var(--ln) !important; display: flex !important; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font: 600 16px var(--ncm-font-mono, monospace) !important; color: var(--t1) !important; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px)); transition: background .12s; }
  .dl__keys button small { font: 8px var(--ncm-font-mono, monospace); color: var(--t3); letter-spacing: .12em; }

  .dl__keys button.hit { background: color-mix(in srgb, var(--hs) 30%, var(--bg3)) !important; border-color: var(--hs) !important; }

    background: color-mix(in srgb, var(--cbc) 8%, var(--bg3));

  .cb__tx .who { max-width: 100%; font: 800 19px/1.05 var(--ncm-font-display, sans-serif); letter-spacing: .06em; text-transform: uppercase; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cb__tx small { font: 10px var(--ncm-font-mono, monospace); color: var(--t2); letter-spacing: .04em; }
  .cb kbd { flex: none; display: grid; place-items: center; width: 28px; height: 28px; font: 700 14px var(--ncm-font-mono, monospace); color: #04130b; background: var(--cbc); border: 0;
    clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%); }
  /* round 23 (dev: "not sure about the gradient… a cool animation on hover"): flat fill at rest. On hover, in one go:
     a charge WIPES across the button behind a bright edge the name glitches (a red/cyan split
     for a beat), the dial spins up and refills segment by segment, the Enter key flashes. Leaving fades the fill. */
  .cb__in > * { position: relative; z-index: 1; }
  .cb__scan { position: absolute !important; z-index: 0 !important; inset: 0; pointer-events: none; transform: scaleX(0); transform-origin: left;
    background: color-mix(in srgb, var(--cbc) 14%, transparent); transition: transform .38s cubic-bezier(.2,.8,.2,1), opacity .25s; opacity: 0; }
  .cb__scan::after { content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: #fff; box-shadow: 0 0 10px var(--cbc), 0 0 2px #fff; opacity: 0; }
  .cb:is(:hover, .hov):not([disabled]) .cb__scan { transform: scaleX(1); opacity: 1; }
  .cb:is(:hover, .hov):not([disabled]) .cb__scan::after { animation: cbEdge .38s ease-out; }
  @keyframes cbEdge { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
  /* round 28: the chosen hover is DECODE (option 3) — the glitch, stripes and charge line are off */

    70% { text-shadow: -1px 0 #ff2a4f, 1px 0 #19f3f7; transform: none; clip-path: none; } 100% { text-shadow: none; } }
  .cb:is(:hover, .hov):not([disabled]) .dial .brk { animation-duration: 1.4s; }
  .cb:is(:hover, .hov):not([disabled]) kbd { animation: cbKey .5s ease-out; }
  @keyframes cbKey { 0% { filter: brightness(2.2); box-shadow: 0 0 14px var(--cbc); } 100% { filter: none; } }
  .cb:is(:hover, .hov):not([disabled]) { filter: brightness(1.12); }
  .cb[disabled] .cb__scan { display: none; }
  /* round 25 (dev: "it's just not obvious on the fill"): a callable button is FILLED — solid green, dark text, the one
     filled action on the screen (the module's rule for a primary action). Nothing-typed and no-signal stay outlined. */
  .cb:not([disabled]) .cb__in { background: var(--cbc); }
  .cb:not([disabled]) .cb__tx b, .cb:not([disabled]) .cb__tx small { color: #062614; }
  .cb:not([disabled]) .cb__tx .who { color: #02150a; }
  .cb:not([disabled]) .dial, .cb:not([disabled]) .dial > i { color: #062614 !important; }
  .cb:not([disabled]) .dial .seg { fill: #062614 !important; } .cb:not([disabled]) .dial .brk path { stroke: #062614 !important; }
  .cb:not([disabled]) .dial .seg.on { filter: none; }
  .cb:not([disabled]) kbd { background: #062614; color: var(--cbc); }
  .cb:not([disabled]) .cb__scan { background: rgba(255,255,255,.22); }
  .cb:not([disabled]) .cb__scan::after { background: #fff; box-shadow: 0 0 12px #fff; }
  .cb:not([disabled]) { box-shadow: 0 0 18px color-mix(in srgb, var(--cbc) 35%, transparent) !important; }

  /* round 26 (dev: "the animation needs to change with the solid green, and it's a bit bright"): a deeper green at rest
     (no glow); on hover the fill comes up to full green, a band of fine diagonal stripes SWEEPS across once (it passes,
     it does not stay), a charge line runs along the bottom edge, the name glitches, the dial refills. */
  .cb:not([disabled]) .cb__in { background: color-mix(in srgb, var(--cbc) 72%, #0b2015); transition: background .25s; }
  .cb:not([disabled]) { box-shadow: none !important; background: color-mix(in srgb, var(--cbc) 85%, #0b2015) !important; }
  .cb:is(:hover, .hov):not([disabled]) .cb__in { background: var(--cbc); }
  .cb:is(:hover, .hov):not([disabled]) { background: color-mix(in srgb, var(--cbc) 60%, #fff) !important; filter: none; }
  .cb:not([disabled]) .cb__scan { transform: none !important; opacity: 0 !important; left: -60%; width: 55%; inset: 0 auto 0 -60%;
    background: repeating-linear-gradient(115deg, rgba(4,30,14,.32) 0 2px, transparent 2px 7px) !important; transition: none !important;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }
  .cb:not([disabled]) .cb__scan::after { display: none; }

  @keyframes cbSweep { 0% { left: -60%; opacity: 1; } 100% { left: 110%; opacity: 1; } }
  .cb:not([disabled]) .cb__in::after { content: ''; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: #04170b; transform: scaleX(0); transform-origin: left; z-index: 2; }

  @keyframes cbCharge { 0% { transform: scaleX(0); opacity: 1; } 80% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }

  @keyframes cbGlitchDark { 0% { text-shadow: -2px 0 #c4002f, 2px 0 #0077aa; transform: translateX(2px); } 35% { text-shadow: 2px 0 #c4002f, -2px 0 #0077aa; transform: translateX(-1px); clip-path: inset(0 0 45% 0); }
    70% { text-shadow: -1px 0 #c4002f, 1px 0 #0077aa; transform: none; clip-path: none; } 100% { text-shadow: none; } }
  .cb:active .cb__in { transform: translateY(1px); }

  .cb--empty { --cbc: #4a5263; cursor: default !important; } .cb--empty .cb__tx .who { color: var(--t3); font-weight: 700; } 
  .cb--nosig { --cbc: #ff4b4b; cursor: not-allowed !important; } .cb--nosig .cb__scan { display: none; } .cb--nosig .dial .brk { animation: none; opacity: .5; }

  .cbrow > div { display: flex; flex-direction: column; gap: 6px; } .cbrow > div > span { font: 11px monospace; color: #8b94a8; }

  .fl .dd i:first-child { color: var(--hs); }
  .fl .qb { width: 28px !important; height: 26px !important; display: grid !important; place-items: center; color: var(--t2) !important; border: 1px solid var(--ln) !important; }
  .fl { flex-wrap: nowrap; } .fl .dd { padding: 4px 7px; }

  /* ── hover animation options (?f=hovers): each loops so it can be watched; the real one plays once per hover ── */
  @property --trace { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .cb__ping, .cb__roll { position: absolute !important; z-index: 0 !important; pointer-events: none; opacity: 0; }
  /* 1 stripes — the current one */
  .cb.hv1 .cb__in { background: var(--cbc); } .cb.hv1 .cb__scan { animation: cbSweep 1.1s cubic-bezier(.3,.6,.3,1) infinite !important; opacity: 1 !important; }
  /* 2 ping — signal rings go out from the dial across the button */
  .cb__ping { left: 31px; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid rgba(4,30,14,.55); }
  .cb.hv2 .cb__ping { animation: cbPing 1.4s ease-out infinite; }
  @keyframes cbPing { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(26); opacity: 0; } }
  /* 3 decode — the label re-decodes: CALL → DIALING ROGUE, letters churning (JS) */
  /* 4 roll — a CRT roll: a darker band rolls down through fine scanlines */
  .cb__roll { inset: 0; background: linear-gradient(180deg, transparent 0 40%, rgba(4,30,14,.28) 40% 60%, transparent 60%) 0 0 / 100% 200%, repeating-linear-gradient(0deg, rgba(4,30,14,.16) 0 1px, transparent 1px 3px); }
  .cb.hv4 .cb__roll { opacity: 1; animation: cbRoll 1.2s linear infinite; }
  @keyframes cbRoll { from { background-position: 0 -100%, 0 0; } to { background-position: 0 100%, 0 0; } }
  /* 5 trace — a bright segment chases round the border */
  .cb.hv5 { background: conic-gradient(from var(--trace), #eafff2 0 14%, color-mix(in srgb, var(--cbc) 85%, #0b2015) 14% 100%) !important; animation: cbTrace 1.1s linear infinite; }
  @keyframes cbTrace { to { --trace: 360deg; } }
  /* 6 punch — it leans in: the label slides right, the Enter key presses, the dial turns a quarter */
  .cb.hv6 .cb__tx { animation: cbLean 1.4s ease-in-out infinite; } .cb.hv6 kbd { animation: cbKey2 1.4s ease-in-out infinite; }
  .cb.hv6 .dial svg { animation: cbTurn 1.4s ease-in-out infinite; }
  @keyframes cbLean { 0%, 100% { transform: none; } 40%, 60% { transform: translateX(5px); } }
  @keyframes cbKey2 { 0%, 100% { transform: none; } 45% { transform: scale(.82); } 60% { transform: scale(1.08); } }
  @keyframes cbTurn { 0%, 100% { transform: none; } 50% { transform: rotate(90deg); } }
  .hvgrid { display: grid; grid-template-columns: repeat(3, 268px); gap: 16px 18px; padding: 16px; background: var(--ncm-bg-surface, #12121c); border: 1px solid var(--ncm-border, #2a2a45); width: max-content; }
  .hvgrid > div { display: flex; flex-direction: column; gap: 6px; } .hvgrid > div > span { font: 11px/1.4 monospace; color: #8b94a8; } .hvgrid > div > span b { color: #e6edf6; }

  /* ── ARMING (round 29, dev: "as you enter the number, will it animate to the first stage?"): the button changes state
     IN PLACE as you type. Empty → a number: the fill wipes in from the left behind a white edge, the label decodes from
     "Type a number" to the digits, the dial fills, the Enter key pops in. A number → a contact: only the name decodes
     (the fill is already on). Deleting back to nothing drains the fill the other way. ── */
  .cb[disabled] kbd { display: none; }
  .cb__in::before { content: ''; position: absolute; inset: 0; z-index: 0; background: color-mix(in srgb, var(--cbc) 72%, #0b2015); transform: scaleX(0); transform-origin: left; pointer-events: none; }
  .cb.arming .cb__in::before { animation: cbArm .42s cubic-bezier(.2,.8,.2,1) both; }
  .cb.arming .cb__in::after { content: ''; position: absolute; top: 0; bottom: 0; width: 2px; left: 0; z-index: 2; background: #fff; box-shadow: 0 0 10px #fff; animation: cbArmEdge .42s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes cbArm { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes cbArmEdge { 0% { left: 0; opacity: 1; } 90% { left: calc(100% - 2px); opacity: 1; } 100% { left: calc(100% - 2px); opacity: 0; } }
  .cb.disarming .cb__in::before { transform-origin: right; animation: cbDisarm .3s ease-in both; }
  @keyframes cbDisarm { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .cb.arming kbd { animation: cbKeyIn .3s .3s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes cbKeyIn { from { transform: scale(0); opacity: 0; } }
  .cb.matched .cb__tx .who { animation: cbMatch .5s ease-out; }
  @keyframes cbMatch { 0% { text-shadow: 0 0 12px #fff; } 100% { text-shadow: none; } }
  .dl__match.pop { animation: rowIn2 .3s ease-out both; }
  @keyframes rowIn2 { from { opacity: 0; transform: translateY(-4px); } }

  .gn__own .box { flex: 1; padding: 8px 10px; border: 1px solid var(--ln); background: var(--bg2); font: 600 15px var(--ncm-font-mono, monospace); color: var(--t1); letter-spacing: .06em; }
  .gn__own .box .ph { color: var(--t3); }
  .gn__st { font: 11.5px var(--ncm-font-mono, monospace); } .gn__st.ok { color: var(--ok); } .gn__st.bad { color: var(--miss); }
  .gn__ft { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .gn__ft small { flex: 1; font: 11.5px var(--ncm-font-body, sans-serif); color: var(--t3); }
  .gn__ft button { padding: 8px 14px !important; font: 700 11px var(--ncm-font-mono, monospace) !important; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--ln) !important; color: var(--t2) !important; }
  .gn__ft button.go { color: #04130b !important; background: color-mix(in srgb, var(--ok) 80%, #0b2015) !important; border-color: var(--ok) !important; }
  .gn__shuf { margin-left: auto; display: inline-flex !important; align-items: center; gap: 6px; padding: 4px 9px !important; font: 700 10px var(--ncm-font-mono, monospace) !important; letter-spacing: .1em; text-transform: uppercase; color: var(--hs) !important; border: 1px dashed color-mix(in srgb, var(--hs) 60%, transparent) !important; }
  /* the player's Contact Manager (concept: the real cards + detail, with a Call button where there is a number) */
  .cm { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  .cm__grid { padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; overflow: auto; }
  .cm__card { position: relative; padding: 12px; background: var(--bg2); border: 1px solid var(--ln); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .cm__card.sel { border-color: var(--hs); box-shadow: inset 0 0 0 1px var(--hs); }
  .cm__card .face { width: 48px; height: 48px; border-radius: 50%; background: var(--bg3) center/cover; border: 1.5px solid var(--tc, var(--ln)); display: grid; place-items: center; font: 700 15px var(--ncm-font-display, sans-serif); color: var(--tc, var(--t2)); }
  .cm__card b { font: 700 13px var(--ncm-font-display, sans-serif); letter-spacing: .05em; text-transform: uppercase; color: var(--t1); }
  .cm__card small { font: 10.5px var(--ncm-font-mono, monospace); color: var(--t2); }
  .cm__card small.no { color: var(--t3); font-style: italic; }
  .cm__card .qa { position: absolute; top: 7px; right: 7px; display: flex; gap: 4px; }
  .cm__card .qa button { width: 26px !important; height: 26px !important; display: grid !important; place-items: center; color: var(--t2) !important; border: 1px solid var(--ln) !important; background: var(--bg) !important; }
  .cm__card .qa button.call { color: #04130b !important; background: color-mix(in srgb, var(--ok) 80%, #0b2015) !important; border-color: var(--ok) !important; }
  .cm__det { border-left: 1px solid var(--ln); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg2); }
  .cm__det .face { width: 72px; height: 72px; border-radius: 50%; background: var(--bg3) center/cover; border: 2px solid var(--tc); align-self: center; }
  .cm__det h3 { margin: 0; text-align: center; border: 0; font: 800 18px var(--ncm-font-display, sans-serif); letter-spacing: .08em; text-transform: uppercase; color: var(--t1); }
  .cm__det .lines { display: flex; flex-direction: column; gap: 4px; font: 12px var(--ncm-font-mono, monospace); color: var(--t2); }
  .cm__det .lines i { width: 16px; color: var(--t3); }
  .cm__det .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cm__det .acts button { display: inline-flex !important; align-items: center; justify-content: center; gap: 7px; padding: 9px !important; font: 700 11px var(--ncm-font-display, sans-serif) !important; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--ln) !important; color: var(--t1) !important; background: var(--bg3) !important; }
  .cm__det .acts button.call { color: #04130b !important; background: color-mix(in srgb, var(--ok) 80%, #0b2015) !important; border-color: var(--ok) !important; }
  /* a message's sender row (concept: the real detail header, with a Call chip) */
  .md { padding: 16px; }
  .md__hd { display: grid; grid-template-columns: 46px 1fr; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--ln); }
  .md__hd .face { width: 46px; height: 46px; border-radius: 50%; background: var(--bg3) center/cover; border: 1.5px solid var(--tc); }
  .md__hd b { font: 700 15px var(--ncm-font-display, sans-serif); letter-spacing: .05em; text-transform: uppercase; color: var(--t1); }
  .md__hd .ad { font: 11.5px var(--ncm-font-mono, monospace); color: var(--t2); }
  .md__chips { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .md__chips span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; font: 700 10px var(--ncm-font-mono, monospace); letter-spacing: .1em; text-transform: uppercase; color: var(--t2); border: 1px solid var(--ln); }
  .md__chips span.call { color: #04130b; background: color-mix(in srgb, var(--ok) 80%, #0b2015); border-color: var(--ok); }
  .md__sub { margin: 14px 0 6px; font: 700 17px var(--ncm-font-display, sans-serif); color: var(--t1); }
  .md__body { font: 14px/1.55 var(--ncm-font-body, sans-serif); color: var(--t2); }

  /* round 34: the region / area-code row in the number picker */
  .gn__reg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gn__reg .sel { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid var(--ln); background: var(--bg2); font: 600 12px var(--ncm-font-body, sans-serif); color: var(--t1); }
  .gn__reg .sel i.fa-caret-down { color: var(--t3); }
  .gn__codes { display: flex; gap: 5px; flex-wrap: wrap; }
  .gn__codes span { padding: 4px 8px; font: 700 11px var(--ncm-font-mono, monospace); color: var(--t2); border: 1px solid var(--ln); cursor: pointer; }
  .gn__codes span small { font-weight: 400; color: var(--t3); margin-left: 4px; font-size: 9.5px; }
  .gn__codes span.on { color: #04161a; background: var(--hs); border-color: var(--hs); } .gn__codes span.on small { color: #04161a; }
</style>
</head>
<body>
<div class="mk-theme"><b>Player theme</b> <select id="th"></select> <small>the Calls tab follows the player's Agent theme. Fixed on purpose: Call = green, No signal / missed = red, a network = its own colour.</small></div>
<div id="frames"></div>
<script>
  const Q = new URLSearchParams(location.search);
  if (Q.get('still') === '1') document.body.classList.add('still');
  const IMG = '../../../../worlds/ncmessenger/thephanthasy_An_illustrative_portrait_of_Kai_Meng_known_as_Verd_fdcb5e3a-adc5-4dc8-8720-e7f92f008405.png';

  // the HUD's dial, small
  const pt = (rr, deg) => { const t = (deg - 90) * Math.PI / 180; return [(30 + rr * Math.cos(t)).toFixed(2), (30 + rr * Math.sin(t)).toFixed(2)]; };
  const arc = (rr, a0, a1) => { const [x0, y0] = pt(rr, a0), [x1, y1] = pt(rr, a1); return `M${x0} ${y0} A${rr} ${rr} 0 0 1 ${x1} ${y1}`; };
  const sector = (r1, r2, a0, a1) => { const [x0, y0] = pt(r2, a0), [x1, y1] = pt(r2, a1), [x2, y2] = pt(r1, a1), [x3, y3] = pt(r1, a0);
    return `M${x0} ${y0} A${r2} ${r2} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r1} ${r1} 0 0 0 ${x3} ${y3} Z`; };
  const DIAL = (lit = 12, icon = 'fa-phone') => `<span class="dial"><svg viewBox="0 0 60 60"><g class="brk">${[8, 98, 188, 278].map((d) => `<path d="${arc(28, d, d + 64)}"/>`).join('')}</g>
    <g>${Array.from({ length: 12 }, (_, i) => `<path class="seg${i < lit ? ' on' : ''}" d="${sector(18.5, 21.5, i * 30 + 4, i * 30 + 26)}"/>`).join('')}</g></svg><i class="fas ${icon}"></i></span>`;
  const NETS = { CitiNet: ['#3ad0ff', 'fa-tower-broadcast'], 'Arasaka CorpNet': ['#ff5468', 'fa-building'], 'The Deep': ['#a77bff', 'fa-mask'] };
  const NET = (n, s = 78) => { const [c, ic] = NETS[n]; const on = s >= 80 ? 4 : s >= 50 ? 3 : s >= 25 ? 2 : 1;
    return `<span class="net" style="--nc:${c}"><i class="fas ${ic}"></i>${n}<span class="bars">${[1, 2, 3, 4].map((i) => `<b class="${i <= on ? 'on' : ''}"></b>`).join('')}</span></span>`; };
  const HUE = { Rogue: '#ff7ab8', Judy: '#4fd1ff', Rache: '#b6ff5c', Jackie: '#ffb84d', Delamain: '#7cf0d0', 'Queen of Hearts': '#ff7ab8' };
  const face = (name, img, anon) => anon ? '<span class="face anon"><i class="fas fa-user-secret"></i></span>'
    : `<span class="face" style="--tc:${HUE[name] || '#9aa'};${img ? `background-image:url('${img}')` : ''}">${img ? '' : name.slice(0, 2).toUpperCase()}</span>`;

  // the Agent shell
  const shell = (body, badge = 3, on = 'calls') => `<div class="ct"><div class="ag__hd"><span class="av"></span><span class="who">V<small>v@nightcity.net · +1 (555) 0177-42</small></span><span class="sp"></span>${NET('CitiNet', 78)}</div>
    <div class="ag__tabs"><span class="ag__tab${on === 'msg' ? ' on' : ''}"><i class="fas fa-inbox"></i> Messages <span class="b cy">3</span></span>
      <span class="ag__tab${on === 'msg' ? '' : ' on'}"><i class="fas fa-phone"></i> Calls${badge ? ` <span class="b">${badge}</span>` : ''}</span><span class="ag__tab"><i class="fas fa-microchip"></i> Shards</span></div>
    <div class="ag__body">${body}</div></div>`;

  // the dialer module
  const KEYS = [['1', ''], ['2', 'ABC'], ['3', 'DEF'], ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'], ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ'], ['*', ''], ['0', '+'], ['#', '']];
  // round 22 (dev: "the call button could be better"): one button, three things in it — the ring dial (it spins up and
  // its segments sweep on hover, the beat the call screen will take over), WHO you are about to call (the name when the
  // number matches a contact, else the number, else "type a number"), and the Enter key. States: ready (green), a number
  // with no contact (green, the number as the label), nothing typed (dim, not clickable), no signal (red, says why).
  const CALLBTN = (state, num = '', who = 'Rogue') => {
    const label = { ready: ['Call', who, 'CitiNet · ENC-128'], number: ['Call', num, 'not in your contacts'], empty: ['Call', 'Type a number', 'or a name'], nosig: ['No signal', 'Dead zone', 'move somewhere with a network'] }[state];
    return `<button class="cb cb--${state}"${state === 'empty' || state === 'nosig' ? ' disabled' : ''}><span class="cb__in">
      ${DIAL(state === 'empty' ? 0 : state === 'nosig' ? 2 : 12, state === 'nosig' ? 'fa-phone-slash' : 'fa-phone')}
      <span class="cb__tx"><b>${label[0]}</b><span class="who">${label[1]}</span><small>${label[2]}</small></span>
      <kbd>⏎</kbd><span class="cb__scan"></span><span class="cb__ping"></span><span class="cb__roll"></span></span></button>`; };
  const dialer = ({ num = '', match = '', as = 'V', alias = false, hit = '', gear = false } = {}) => `<div class="dl">
    <div class="dl__sig">▸ Line ready <span class="dim">//</span> CitiNet <span class="dim">·</span> ch36 <span class="dim">·</span> ENC-128 <span class="dim">· open band</span></div>
    <div class="dl__as">Call as <span class="chip${alias ? ' alias' : ''}">${alias ? '<i class="fas fa-mask"></i>' : '<i class="fas fa-id-badge"></i>'} ${as} <i class="fas fa-caret-down"></i></span><button class="dl__gear${gear ? ' on' : ''}" title="My line: greeting and voicemail"><i class="fas fa-gear"></i></button></div>
    <div class="dl__num cut"><div class="in cut"><span class="val">${num}<span class="car"></span></span><button class="del" title="Delete"><i class="fas fa-delete-left"></i></button></div></div>
    <div class="dl__match">${match}</div>
    <div class="dl__keys">${KEYS.map(([k, s]) => `<button class="${k === hit ? 'hit' : ''}">${k}<small>${s || '&nbsp;'}</small></button>`).join('')}</div>
    ${CALLBTN(num ? (match || /[a-z]/i.test(num) ? 'ready' : 'number') : 'empty', num)}
  </div>`;

  // speed dial + filters + the log
  const SPEED = `<div class="sd"><span class="sd__k">Speed dial</span>
    <span class="sd__p" title="Rogue · Afterlife">${face('Rogue', IMG).replace('</span>', '<i class="dot"></i></span>')}<span>Rogue</span></span>
    <span class="sd__p">${face('Judy').replace('</span>', '<i class="dot"></i></span>')}<span>Judy</span></span>
    <span class="sd__p">${face('Rache').replace('</span>', '<i class="dot off"></i></span>')}<span>Rache</span></span>
    <span class="sd__p">${face('Jackie').replace('</span>', '<i class="dot off"></i></span>')}<span>Jackie</span></span>
    <span class="sd__p">${face('Delamain')}<span>Delamain</span></span>
    <span class="sd__p"><span class="sd__add"><i class="fas fa-plus"></i></span><span>Add</span></span></div>`;
  // round 27 (dev: "pagination and better sorting"): ONE toolbar row — quick chips for what needs you (missed,
  // voicemail), a Show menu for the rest (incoming / outgoing / with a transcript / one person), Sort, and search.
  // Under the list a page bar: 25 a page, "1–25 of 132", page numbers, the page size.
  const FILTERS = (on = 'all') => `<div class="fl">${[['all', 'All', ''], ['missed', 'Missed', '<span class="n">1</span>', 'r'], ['vm', 'Voicemail', '<span class="n">1</span>', 'y']].map(([k, l, n, c]) =>
    `<button class="${k === on ? 'on' : ''} ${c || ''}">${l}${n}</button>`).join('')}
    <span class="dd" title="Show: everything · incoming · outgoing · missed · voicemail · with a transcript · one person"><i class="fas fa-filter"></i> Show <i class="fas fa-caret-down"></i></span>
    <span class="dd" title="Sort: newest · oldest · longest · by person (grouped) · most called"><i class="fas fa-arrow-down-wide-short"></i> Newest <i class="fas fa-caret-down"></i></span>
    <span class="sp"></span><button class="qb" title="Search calls (name, number, transcript)"><i class="fas fa-magnifying-glass"></i></button></div>`;
  const PAGER = `<div class="pg"><span class="pg__n">1–25 <small>of 132 calls</small></span><span class="sp"></span>
    <button class="ar" title="Newer"><i class="fas fa-chevron-left"></i></button><button class="on">1</button><button>2</button><button>3</button><span class="gap">…</span><button>6</button><button class="ar" title="Older"><i class="fas fa-chevron-right"></i></button></div>`;
  const DIR = { in: ['fa-arrow-down', '#4be38a', 'In'], out: ['fa-arrow-up', 'var(--hs)', 'Out'], miss: ['fa-phone-slash', 'var(--miss)', 'Missed'], vm: ['fa-voicemail', 'var(--vmc)', 'Voicemail'] };
  const MODE = { loud: ['fa-users', 'out loud'], type: ['fa-keyboard', 'typed'], dict: ['fa-microphone', 'dictated'] };
  const row = (o) => { const [ic, col, word] = DIR[o.dir];
    return `<div class="row ${o.dir === 'miss' ? 'miss' : ''}${o.dir === 'vm' ? ' vmail' : ''}${o.open ? ' open' : ''}" style="--dc:${col}">
      <span class="dir"><i class="fas ${ic}"></i></span>${face(o.name, o.img, o.anon)}
      <div><div class="nm">${o.anon ? 'Number withheld' : o.name}${o.alias ? ` <span class="tag alias">${o.alias}</span>` : ''}${o.isNew ? ' <span class="tag new">New</span>' : ''}</div>
        <div class="sub"><span class="k">${word}</span>${o.dur ? `<span>${o.dur}</span>` : ''}${o.mode ? `<span class="md" title="${MODE[o.mode][1]}"><i class="fas ${MODE[o.mode][0]}"></i></span>` : ''}${o.net ? NET(o.net, o.sig) : ''}</div></div>
      <span class="when">${o.when}</span>
      <span class="acts">${o.dir === 'vm' ? '<button class="vm" title="Play"><i class="fas fa-play"></i></button>' : ''}${o.mode === 'type' || o.mode === 'dict' ? '<button title="Transcript"><i class="fas fa-closed-captioning"></i></button>' : ''}${o.anon ? '' : '<button class="go" title="Call back"><i class="fas fa-phone"></i></button>'}</span>
      ${o.drawer || ''}</div>`; };

  const VM_DRAWER = `<div class="drw"><div class="play"><button class="pb"><i class="fas fa-pause"></i></button><canvas data-wave width="600" height="68"></canvas><span class="t">0:09 / 0:24</span></div>
    <div class="trn"><small>Transcript</small>V. The Pier 4 thing is off — Arasaka's got a Trauma Team contract on that dock now. Call me before you do anything stupid.</div>
    <div class="drw__acts"><button class="go"><i class="fas fa-phone"></i> Call back</button><button><i class="fas fa-reply"></i> Reply by message</button><button><i class="fas fa-microchip"></i> Save to shard</button><button><i class="fas fa-comment"></i> Share to chat</button><button class="bad"><i class="fas fa-trash"></i></button></div></div>`;
  const TR_DRAWER = `<div class="drw"><div class="subs">
      <div class="l"><b style="color:var(--hc)">Judy:</b>You at the Afterlife? <time>20:11</time></div>
      <div class="l"><b style="color:var(--hs)">V:</b>Close. What's wrong? <time>20:11</time></div>
      <div class="l"><b style="color:var(--hc)">Judy:</b>Evelyn's gone dark. Last ping was Jig-Jig Street. <time>20:12</time></div>
      <div class="l"><b style="color:var(--hs)">V:</b>On my way. Keep your line open. <time>20:13</time></div></div>
    <div class="drw__acts"><button class="go"><i class="fas fa-phone"></i> Call back</button><button><i class="fas fa-microchip"></i> Save to shard</button><button><i class="fas fa-comment"></i> Share to chat</button><button><i class="fas fa-copy"></i> Copy</button></div></div>`;

  const LOG = (filter, opts = {}) => `<div class="lg">${SPEED}${FILTERS(filter)}<div class="ls">
    <div class="day">Tonight · 15 Aug 2045</div>
    ${row({ dir: 'vm', name: 'Rogue', img: IMG, dur: '0:24', net: 'CitiNet', sig: 78, when: '22:41', isNew: !opts.vm, open: opts.vm, drawer: opts.vm ? VM_DRAWER : '' })}
    ${row({ dir: 'miss', anon: true, net: 'The Deep', sig: 52, when: '21:58' })}
    ${row({ dir: 'out', name: 'Judy', dur: '4:12', mode: 'type', net: 'CitiNet', sig: 78, when: '20:15', open: opts.tr, drawer: opts.tr ? TR_DRAWER : '' })}
    <div class="day">Yesterday</div>
    ${row({ dir: 'in', name: 'Queen of Hearts', img: IMG, alias: 'alias of Rogue', dur: '1:03', mode: 'loud', net: 'Arasaka CorpNet', sig: 96, when: '23:20' })}
    ${row({ dir: 'out', name: 'Delamain', net: 'CitiNet', sig: 78, when: '19:02', dur: 'no answer' })}
    ${row({ dir: 'in', name: 'Rache', dur: '0:41', mode: 'dict', net: 'CitiNet', sig: 22, when: '14:47' })}
  </div>${PAGER}</div>`;

  const MATCH = `<div class="mt">
    <div class="mt__r on">${face('Rogue', IMG)}<span class="n"><mark>Ro</mark>gue<small>+1 (555) 0119-07 · Afterlife</small></span><i class="fas fa-turn-down fa-rotate-90" style="color:var(--hs)"></i></div>
    <div class="mt__r">${face('Queen of Hearts', IMG)}<span class="n">Queen of Hearts<small>+1 (555) 0342-90</small></span><span class="tag">alias of <mark style="background:none;color:var(--hs)">Ro</mark>gue</span></div>
    <div class="mt__r">${face('Rache')}<span class="n"><mark>R</mark>ache<small>+1 (555) 0118-60</small></span><span></span></div></div>`;

  // ── My line: the selected number's greeting + voicemail settings (round 21, dev: "do players set their own voicemail?") ──
  const LINES = (on) => `<div class="ml__lines">
      <div class="ml__line cut${on === 'v' ? ' on' : ''}"><div class="in cut"><i class="fas fa-id-badge"></i><span><b>V</b><small>+1 (555) 0177-42 · main</small></span></div></div>
      <div class="ml__line al cut${on === 'nix' ? ' on' : ''}"><div class="in cut"><i class="fas fa-mask"></i><span><b>Nix</b><small>+1 (555) 0612-08 · burner</small></span></div></div></div>`;
  const WAYS = (on) => `<div class="ways">${[['typed', 'fa-keyboard', 'Typed', 'Your words as a subtitle.'], ['rec', 'fa-microphone', 'Recorded', 'Your own voice.'],
      ['tts', 'fa-robot', 'Read out', 'A synthetic voice reads your words.'], ['def', 'fa-tower-broadcast', 'Default', '"The person you are calling is not available."']]
      .map(([k, ic, b, sm]) => `<div class="way${k === on ? ' on' : ''}"><b><i class="fas ${ic}"></i> ${b}</b><small>${sm}</small></div>`).join('')}</div>`;
  const MYLINE = (alias) => `<div class="ml${alias ? ' alias' : ''}">
    <div class="ml__hd"><i class="fas fa-sim-card" style="color:var(--mc)"></i><h4>My line</h4><span class="mono" style="font-size:11px;color:var(--t2)">greeting and voicemail, per number</span><button class="x"><i class="fas fa-xmark"></i></button></div>
    ${LINES(alias ? 'nix' : 'v')}
    <div class="ml__bd">
      <div class="ml__sec"><div class="ml__k">Greeting</div>${WAYS(alias ? 'tts' : 'rec')}
        ${alias ? `<div class="fld"><label>What it says</label><div class="ta">Yeah. Leave it.</div></div>
          <div class="fld"><label>Voice</label><span class="sel"><i class="fas fa-robot"></i> Microsoft Guy — English (US) <i class="fas fa-caret-down"></i></span> <span class="mono" style="font-size:10.5px;color:var(--t3);margin-left:6px">the voices this browser has</span></div>`
        : `<div class="rec"><button class="rb" title="Record again"><i class="fas fa-microphone"></i></button><canvas data-wave width="600" height="68"></canvas><span class="t">0:04</span></div>
          <div class="fld"><label>Words under it <span style="text-transform:none;letter-spacing:0">(optional — shown as the subtitle)</span></label><div class="ta">You've reached V. You know what to do.</div></div>`}
        <div class="pv"><small>As a caller sees it</small><button class="play"><i class="fas fa-play"></i> Preview</button>
          <div class="s"><b>${alias ? 'Nix' : 'V'} · greeting:</b>${alias ? 'Yeah. Leave it.' : 'You\'ve reached V. You know what to do.'}</div><div class="tone">── leave a message after the tone ──</div></div></div>
      <div class="ml__sec"><div class="ml__k">Voicemail</div>

  // the voicemail waveform (played part amber, the rest dim)
  addEventListener('load', () => document.querySelectorAll('[data-wave]').forEach((cv) => {
    const g = cv.getContext('2d'); const W = cv.width, H = cv.height; const col = cv.closest('.ml') ? (getComputedStyle(cv.closest('.ml')).getPropertyValue('--mc').trim() || '#19f3f7') : (getComputedStyle(cv.closest('.ct')).getPropertyValue('--vmc').trim() || '#f7c948');
    let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let x = 0; x < W; x += 6) { const h = (0.15 + rnd() * 0.85) * H * (0.4 + 0.6 * Math.abs(Math.sin(x / 70))); g.fillStyle = x < W * 0.38 ? col : 'rgba(255,255,255,.22)'; g.fillRect(x, (H - h) / 2, 3, h); }
  }));
  // the call button's dial fills when a number is ready (the HUD's beat)
  // hover: the dial empties and refills segment by segment (the call screen's beat), once per hover
  const G = '!<>-_/[]{}=+*^?#01ABCDEFXZ';
  const decodeTo = (el, to, ms) => { if (!el) return; const n = to.length, t0 = performance.now(); el._dec = t0;
    const tick = (now) => { if (el._dec !== t0) return; const pp = (now - t0) / ms, set = Math.floor(pp * n);
      el.textContent = [...to].map((c, i) => i < set || c === ' ' ? c : G[Math.floor(Math.random() * G.length)]).join(''); if (pp < 1) requestAnimationFrame(tick); else el.textContent = to; };
    requestAnimationFrame(tick); };
  document.querySelectorAll('.cb:not([disabled]):not([class*="hv"])').forEach((b) => {
    const k = b.querySelector('.cb__tx b'), w = b.querySelector('.cb__tx .who'); const name = w.textContent;
    b.addEventListener('mouseenter', () => { decodeTo(k, 'Dial ▸', 260); decodeTo(w, name, 380); });
    b.addEventListener('mouseleave', () => { decodeTo(k, 'Call', 200); });
  });
  document.querySelectorAll('.cb.hov .cb__tx b').forEach((k) => { k.textContent = 'Dial ▸'; });
  // ── the button's state machine (what the build does on every keystroke in the number box) ──
  const BOOK = { '555011907': { name: 'Rogue', where: 'Afterlife', sub: 'CitiNet · ENC-128', img: IMG } };
  const fmt = (d) => d.slice(0, 3) + (d.length > 3 ? ' ' + d.slice(3, 7) : '') + (d.length > 7 ? '-' + d.slice(7) : '');
  function refill(b) { const segs = [...b.querySelectorAll('.seg')]; clearInterval(b._ref); let n = 0; segs.forEach((g) => g.classList.remove('on'));
    b._ref = setInterval(() => { segs.forEach((g, i) => g.classList.toggle('on', i < n)); if (++n > 12) clearInterval(b._ref); }, 26); }
  function setCallState(b, digits) {
    const k = b.querySelector('.cb__tx b'), w = b.querySelector('.cb__tx .who'), sm = b.querySelector('.cb__tx small');
    const hit = BOOK[digits]; const next = digits.length >= 3 ? (hit ? 'ready' : 'number') : 'empty';
    const prev = b.dataset.state || (b.classList.contains('cb--empty') ? 'empty' : 'ready');
    b.dataset.state = next;
    b.classList.remove('cb--empty', 'cb--number', 'cb--ready', 'arming', 'disarming', 'matched'); void b.offsetWidth;
    b.classList.add('cb--' + next); b.disabled = next === 'empty';
    if (prev === 'empty' && next !== 'empty') { b.classList.add('arming'); refill(b); decodeTo(k, 'Call', 240); decodeTo(w, hit ? hit.name : fmt(digits), 360); decodeTo(sm, hit ? hit.sub : 'not in your contacts', 360); }
    else if (prev !== 'empty' && next === 'empty') { b.classList.add('disarming'); decodeTo(w, 'Type a number', 300); decodeTo(sm, 'or a name', 300); b.querySelectorAll('.seg').forEach((g) => g.classList.remove('on')); }
    else if (next === 'ready' && prev !== 'ready') { b.classList.add('matched'); decodeTo(w, hit.name, 420); decodeTo(sm, hit.sub, 360); }
    else if (next === 'number') w.textContent = fmt(digits);
    const box = b.closest('.dl'); const m = box.querySelector('.dl__match');
    if (hit && !m.innerHTML) { m.innerHTML = `<span class="face" style="background-image:url('${hit.img}')"></span> ${hit.name} · ${hit.where}`; m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop'); }
    if (!hit) m.innerHTML = '';
  }
  document.querySelectorAll('[data-armdemo]').forEach((ct) => {
    const b = ct.querySelector('.cb'), val = ct.querySelector('.dl__num .val'), keys = [...ct.querySelectorAll('.dl__keys button')];
    let d = ''; const show = () => { val.innerHTML = fmt(d) + '<span class="car"></span>'; setCallState(b, d); };
    const press = (ch) => { const kb = keys.find((x) => x.firstChild.textContent === ch); kb?.classList.add('hit'); setTimeout(() => kb?.classList.remove('hit'), 160); d += ch; show(); };
    keys.forEach((kb) => kb.addEventListener('click', () => press(kb.firstChild.textContent)));
    ct.querySelector('.dl__num .del').addEventListener('click', () => { d = d.slice(0, -1); show(); });
    if (Q.get('still') === '1') { d = '555011907'; show(); return; }
    const NUM = '555011907';
    const loop = () => { d = ''; show(); let i = 0;
      const t = setInterval(() => { press(NUM[i++]); if (i >= NUM.length) { clearInterval(t);
        setTimeout(() => b.classList.add('hov'), 1200); setTimeout(() => { decodeTo(b.querySelector('.cb__tx b'), 'Dial ▸', 260); refill(b); }, 1200);
        setTimeout(() => { b.classList.remove('hov'); decodeTo(b.querySelector('.cb__tx b'), 'Call', 200); }, 3000);
        setTimeout(() => { const back = setInterval(() => { d = d.slice(0, -1); show(); if (!d) { clearInterval(back); setTimeout(loop, 1400); } }, 70); }, 4200); } }, 330); };
    setTimeout(loop, 700);
  });
  document.querySelectorAll('.cb:not([disabled])').forEach((b) => { let t; b.addEventListener('mouseenter', () => {
    const segs = [...b.querySelectorAll('.seg')]; clearInterval(t); let n = 0; segs.forEach((g) => g.classList.remove('on'));
    t = setInterval(() => { segs.forEach((g, i) => g.classList.toggle('on', i < n)); if (++n > 12) clearInterval(t); }, 28); }); });
  if (Q.get('hover') === '1') document.querySelectorAll('.cb--ready').forEach((b) => b.classList.add('hov'));
  if (false) document.querySelectorAll('.cb--ready .dial, .cb--number .dial').forEach((d) => { const segs = [...d.querySelectorAll('.seg')]; let n = 0;
    setInterval(() => { segs.forEach((g, i) => g.classList.toggle('on', i < n)); n = n >= 13 ? 0 : n + 1; }, 2200 / 14); });
</script>
