<!--
  Conversation view, second round (2026-10-30, dev: "not change too much other than just that center content area").
  conversation-view-mock.html (bubbles, new head, large reply box) stays as the record of the first try.
  Everything outside the middle pane is the real inbox markup and is unchanged. Inside the pane this REUSES what ships:
    · the subject strip, with Conversation | Message where the Thread pill was (the switch is the setting, per player)
    · the existing transcript: the timeline rail and cards (ncm-viewer__thread-*), your own cards tinted
    · the quick reply bar, now also in the conversation, growing as you type
  New, and only these: the switch · the Reply to row (people as chips with an X, plus Add) · day and "new" lines ·
  "You added Mox" lines (worked out by comparing one message's participants with the next, only when both have a list) ·
  closed cards for mail where opening does something · the rider row for attachments, eddies and typed files.
  Add and remove mean "who is on the next reply". It stays email: a removed person keeps what they have, and replying
  from their older copy brings them back. The arrow on a card opens that message in Message view, with its full action row.
  Serve: node dev/tools/serve-mockups.cjs → http://127.0.0.1:8123/dev/mockups/conversation-view-v2-mock.html
    ?state=today|todaythread|group|people|special|anon|oneway|deadzone|message   ?t=clean-dark|clean-light|high-contrast   ?w=   ?h=   ?scale=   ?contrast=1
-->

<script>

    { id: 's1', from: 'mox', time: '17:20', long: true, body: P('Here is the short version, and I know you hate the long one. The Tyger crew have been leaning on the clinic on 5th for a month, and the ripperdoc who runs it is somebody I owe. I need the name of whoever signed off on the protection money. It will be in their books, and their books are on a machine in the back of the noodle bar they use as a front.', 'I am not asking you to burn anybody. Get in, get the ledger, get out. If it goes loud, you never heard of me and I never heard of you. I will make it worth your time, and I will clear what you owe me on top of that.', 'Bring someone who knows what they are doing with a terminal. The last person I sent lost two fingers and a very nice jacket.') },

const pane = document.getElementById('pane');

win.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-mode],[data-act],[data-remove],[data-jump],[data-addid]');

  if (openPick && !ev.target.closest('.ncm-viewer__reply-pick')) openPick.remove();

  if (t.dataset.remove) { toList = toList.filter((x) => x !== t.dataset.remove); repaintReply(); return; }

    const m = pane.querySelector(`[data-tid="${t.dataset.jump}"]`); if (!m) return;
    m.scrollIntoView({ block: 'center', behavior: 'smooth' });
    m.classList.add('is-flash'); setTimeout(() => m.classList.remove('is-flash'), 1200);
    return;
  }
  const s = pane.querySelector('[data-scroll]');
  switch (t.dataset.act) {
    case 'tomsg': mode = 'msg'; paint(); break;
    case 'more': t.previousElementSibling.classList.remove('is-clamped'); t.remove(); break;
    case 'earlier': t.textContent = 'Older messages load here'; break;
    case 'open': t.closest('.ncm-viewer__thread-card-body').innerHTML = '<p>(The message opens here. In the real thing this is where its self-destruct, trace or breach starts.)</p>'; break;
    case 'add': {

      const box = document.createElement('div'); box.className = 'ncm-viewer__reply-pick';

      pane.querySelector('.ncm-viewer__quick-reply--conv').appendChild(box);
      box.querySelector('input').focus();
      break;
    }
    case 'send': {
      const area = pane.querySelector('textarea.ncm-viewer__quick-reply-input');
      const text = area.value.trim(); const rail = pane.querySelector('[data-rail]');
      if (!text || !rail) return;

    }
  }
});

if (q.get('contrast')) {
  const run = () => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 1;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    const rgba = (c) => { cx.clearRect(0, 0, 1, 1); cx.fillStyle = '#000'; cx.fillStyle = c; cx.fillRect(0, 0, 1, 1); const d = cx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2], d[3] / 255]; };
    const lum = ([r, g, b]) => { const f = (v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
    const over = (t, u) => [0, 1, 2].map((i) => t[i] * t[3] + u[i] * (1 - t[3])).concat(1);
    const bgOf = (el) => { const st = []; for (let e = el; e; e = e.parentElement) { const c = rgba(getComputedStyle(e).backgroundColor); if (c[3] > 0) st.push(c); if (c[3] === 1) break; } let b = [21, 24, 26, 1]; for (const c of st.reverse()) b = over(c, b); return b; };
    const bad = []; let n = 0;
    const w = document.createTreeWalker(pane, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) {
      const t = w.currentNode; if (!t.textContent.trim()) continue;
      const el = t.parentElement; if (!el.offsetParent) continue; n++;
      const bg = bgOf(el); const fg = over(rgba(getComputedStyle(el).color), bg);
      const [a, b] = [lum(fg), lum(bg)].sort((x, y) => y - x); const r = (a + .05) / (b + .05);
      if (r < 4.5) bad.push(`${r.toFixed(2)}  ${String(el.className || el.tagName).slice(0, 40)}: ${t.textContent.trim().slice(0, 40)}`);
    }
    document.title = `${n} nodes, ${bad.length} under 4.5`;
    document.getElementById('mk-report').textContent = `${document.title}\n${bad.join('\n')}`;
  };
  document.fonts.ready.then(() => setTimeout(run, 300));
}
</script>
</body>
