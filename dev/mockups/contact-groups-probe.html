<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact groups — real partial</title>
<!--
  Probe: renders the REAL templates/contact-manager/partials/contact-groups-panel.hbs
  through Handlebars with the view-model shape ContactManagerApp._contactGroupsContext()
  produces, against the real cascade (foundry2.css → CPR main.css → night-city-messenger.css,
  i.e. the shipped ncm-cgr rules in styles/components/contact-groups.css). Three states:
  a tray open · eighteen groups folded behind "+N more" · no groups.
  It fetches the .hbs, so serve it: node dev/tools/serve-mockups.cjs → http://127.0.0.1:8123/dev/mockups/contact-groups-probe.html
  (off disk it needs --allow-file-access-from-files).  ?open=<index>  ?expanded=1
-->
<link id="css-foundry" rel="stylesheet" href="">
<link id="css-fa" rel="stylesheet" href="">
<link id="css-cpr" rel="stylesheet" href="">
<script>
  const isFile = location.protocol === 'file:';
  const FVTT = 'file:///C:/Program%20Files/Foundry%20Virtual%20Tabletop/resources/app/public';
  document.getElementById('css-foundry').href = isFile ? `${FVTT}/css/foundry2.css` : '/_vendor/foundry2.css';
  document.getElementById('css-fa').href = isFile ? `${FVTT}/fonts/fontawesome/css/all.min.css` : '/_vendor/fa/css/all.min.css';
  document.getElementById('css-cpr').href = isFile ? '../../../../systems/cyberpunk-red-core/main.css' : '/_vendor/cpr.css';
</script>
<link rel="stylesheet" href="../../styles/night-city-messenger.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
<style>
  body { margin: 0; background: #0b0b10; color: #ccc; font-family: var(--ncm-font-display, sans-serif); }
  .stage { display: flex; flex-direction: column; gap: 22px; padding: 22px 26px; align-items: flex-start; }
  .stage > h2 { margin: 0 0 -10px; font: 700 11px/1 var(--ncm-font-display); letter-spacing: .12em; text-transform: uppercase; color: #8888a0; }
  .frame { position: relative !important; width: 960px; display: flex; flex-direction: column; overflow: hidden; }
  .frame .window-header { cursor: default; flex: 0 0 auto; }
  .frame .window-content { flex: 1; min-height: 0; padding: 0 !important; }
  .frame .ncm-contacts-v5 { padding-bottom: 12px; }
  #report { white-space: pre; font: 12px/1.5 var(--ncm-font-mono); color: #9d9db4; }
</style>
</head>
<body>
<div class="stage">
  <h2>Real partial · tray open</h2>
  <div class="app window-app ncm-app ncm-contact-manager frame" data-ncm-scanlines="false" data-ncm-neon="false"><section class="window-content"><div class="ncm-contacts-v5" id="s1"></div></section></div>
  <h2>Real partial · eighteen groups, folded</h2>
  <div class="app window-app ncm-app ncm-contact-manager frame" data-ncm-scanlines="false" data-ncm-neon="false"><section class="window-content"><div class="ncm-contacts-v5" id="s2"></div></section></div>
  <h2>Real partial · no groups</h2>
  <div class="app window-app ncm-app ncm-contact-manager frame" data-ncm-scanlines="false" data-ncm-neon="false"><section class="window-content"><div class="ncm-contacts-v5" id="s3"></div></section></div>
  <div id="report"></div>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const src = await fetch('../../templates/contact-manager/partials/contact-groups-panel.hbs').then(r => r.text());
  Handlebars.registerHelper('eq', (a, b) => a === b);
  const tpl = Handlebars.compile(src);
  const C = ['#19f3f7', '#f7c948', '#34d399', '#f65261', '#ffab00', '#a78bfa', '#60a5fa', '#f472b6', '#9aa0b4'];
  const ini = (n) => n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const P = [['Rogue', 'Fixer', 'rogue@afterlife.nc'], ['Jackie Welles', 'Solo', 'jackie@valentinos.nc'], ['Judy Alvarez', 'Techie', 'judy@moxes.nc'], ['Viktor Vektor', 'Medtech', 'vik@ripperdoc.nc'], ['Panam Palmer', 'Nomad', 'panam@aldecaldos.nc'], ['Kerry Eurodyne', 'Rockerboy', 'kerry@samurai.nc']];
  const member = (i) => ({ contactId: 'c' + i, name: P[i][0], initials: ini(P[i][0]), img: '', detail: `${P[i][1]} · ${P[i][2]}`, isRaw: false });
  const raw = (a) => ({ contactId: '', name: a, initials: '@', img: '', detail: 'address only', isRaw: true });
  const group = (id, name, color, members, shared) => {
    const people = members;
    return { id, name, color, count: people.length, shared: !!shared, isOpen: false, stack: people.slice(0, 3).map(p => ({ img: p.img, initials: p.initials })), more: Math.max(0, people.length - 3), _people: people };
  };
  const base = [
    group('g1', 'The Crew', C[0], [member(0), member(1), member(2), member(3), member(4), raw('dex@nightcity.net')], true),
    group('g2', 'Afterlife Regulars', C[1], [member(0), member(5)]),
    group('g3', 'Aldecaldos', C[2], [member(4), raw('saul@aldecaldos.nc')]),
    group('g4', 'Arasaka Leads', C[3], [member(3)]),
  ];
  const ctx = (list, { openIdx = -1, total = list.length, hiddenCount = 0, expanded = false } = {}) => {
    const l = list.map(g => ({ ...g }));
    let open = null;
    if (openIdx >= 0 && l[openIdx]) { l[openIdx].isOpen = true; const o = l[openIdx]; open = { id: o.id, name: o.name, color: o.color, count: o.count, shared: o.shared, members: o._people }; }
    return { contactGroups: { total, expanded, hiddenCount, list: l, open } };
  };
  const chrome = `<div class="ncm-toolbar"><div class="ncm-search-row"><i class="fas fa-search"></i><input class="ncm-search-input" type="text" placeholder="Search contacts..."><span class="ncm-search-count">14 contacts</span></div></div>`;
  document.getElementById('s1').innerHTML = chrome + tpl(ctx(base, { openIdx: Number(q.get('open') ?? 0) }));
  const many = [...base, ...['Moxes', 'Ripperdocs', 'NCPD Contacts', 'Valentinos', 'Media Leads', 'Netrunners', 'Maelstrom', 'Tyger Claws', 'Corpo Rats', 'Mercs for Hire', 'Watson Crew', 'Pacifica', 'Clients', 'Blackmail Targets'].map((n, i) => group('x' + i, n, C[(i + 4) % C.length], [member(i % 6), member((i + 2) % 6)].slice(0, 1 + (i % 2))))];
  const expanded = q.get('expanded') === '1';
  document.getElementById('s2').innerHTML = chrome + tpl(ctx(expanded ? many : many.slice(0, 6), { total: many.length, hiddenCount: expanded ? 0 : many.length - 6, expanded }));
  document.getElementById('s3').innerHTML = chrome + tpl(ctx([], { total: 0 }));
  // report: clipping + undefined-token check
  const probs = [];
  for (const el of document.querySelectorAll('.ncm-cgr *')) {
    const cs = getComputedStyle(el);
    if (el.classList.contains('ncm-cgr__chip-name') || el.classList.contains('ncm-cgr__m-name')) { if (el.scrollWidth > el.clientWidth + 1) probs.push(`truncated: ${el.textContent.trim()}`); }
  }
  const tray = document.querySelector('.ncm-cgr__tray');
  // member card geometry: how far the detail line sits below the name
  const mName = document.querySelector('.ncm-cgr__member .ncm-cgr__m-name'), mSub = document.querySelector('.ncm-cgr__member .ncm-cgr__m-sub');
  const card = document.querySelector('.ncm-cgr__member');
  const geo = mName && mSub ? `member card: height ${card.offsetHeight}px · name ${mName.getBoundingClientRect().top.toFixed(1)}→${mName.getBoundingClientRect().bottom.toFixed(1)} · detail ${mSub.getBoundingClientRect().top.toFixed(1)}→${mSub.getBoundingClientRect().bottom.toFixed(1)} · gap ${(mSub.getBoundingClientRect().top - mName.getBoundingClientRect().bottom).toFixed(1)}px` : 'member card: none';
  const report = [geo, `chips: ${document.querySelectorAll('.ncm-cgr__chip').length}`, `tray members: ${tray ? tray.querySelectorAll('.ncm-cgr__member').length : 0}`, `tray bg: ${tray ? getComputedStyle(tray).backgroundColor : '-'}`, ...probs];
  document.getElementById('report').textContent = report.join('\n');
  document.title = probs.length ? `groups probe: ${probs.length} truncations` : 'groups probe: ok';
})();
</script>
</body>
</html>
