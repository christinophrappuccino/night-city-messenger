    const T = (label, icon, tone, action, data) => ({ label, icon, tone, action, data });
    const timers = empty ? [] : [

      { id: 'mail:1', kind: 'mail', at: NOW + 25 * MIN, name: '"Meet at the dock"', subline: 'Rogue → Kiri', lines: [{ k: 'From', v: 'Rogue' }, { k: 'To', v: 'Kiri' }, { k: 'Clock', v: 'Game time' }], actions: [T('Send now', 'fa-paper-plane', 'pri', 'tabAct', { owner: 'messages', op: 'schedSendNow', 'schedule-id': 'S1' }), T('Change time', 'fa-clock', '', 'editScheduled', { 'schedule-id': 'S1' }), T('Cancel', 'fa-xmark', 'bad', 'cancelScheduled', { 'schedule-id': 'S1' })] },
      { id: 'destruct:1', kind: 'destruct', at: NOW + 70 * MIN, name: '"burn after reading"', subline: "In V's inbox", lines: [{ k: 'From', v: 'Anonymous' }, { k: 'To', v: 'V' }], actions: [T('Erase now', 'fa-fire', 'bad', 'hardDeleteMessage', { 'message-id': 'M9', 'inbox-owner': 'v' }), T('Stop', 'fa-hand', '', 'tabAct', { owner: 'messages', op: 'stopTimer', 'journal-id': 'J', 'page-id': 'P' })] },
      { id: 'backdoor:1', kind: 'backdoor', at: NOW + 6 * 60 * MIN, name: '"ghost@" on WS-7F-12 closes', subline: 'WS-7F-12', lines: [{ k: 'Made by', v: 'Rache' }, { k: 'Login', v: 'ghost', mono: true }], actions: [T('Close now', 'fa-door-closed', 'bad', 'tabAct', { owner: 'overview', op: 'rwClose', 'item-id': 'ws', 'account-id': 'a9' })] },
      { id: 'lockout:1', kind: 'lockout', at: NOW + 20 * 60 * MIN, name: 'Hiro locked out of WS-7F-12 · v_arasaka', subline: 'Lockout · terminal', lines: [{ k: 'Who', v: 'Hiro' }, { k: 'Why', v: 'Too many failed tries' }], actions: [T('Lift now', 'fa-unlock', 'pri', 'tabAct', { owner: 'overview', op: 'rwLift', 'lock-actor': 'hiro', 'lock-target': 'ws::a1' })] },
      { id: 'mail:2', kind: 'mail', at: NOW + 3 * 60 * MIN, name: '"Payment received"', subline: 'Bank → V', lines: [], actions: [T('Send now', 'fa-paper-plane', 'pri', 'tabAct', { owner: 'messages', op: 'schedSendNow', 'schedule-id': 'S2' })] },
    ];
    const nl = { ...M.nowLineLayout({ activity, needs, timers, nowMs: NOW, zoom: Number(Q.get('zoom')) || 60, open: Q.get('open'), sel: Q.get('sel'), off: (Q.get('off') || '').split(',').filter(Boolean), trackPx: pop ? 680 : M.NL_TRACK_PX, clock }), feedFilter: 'all' };
    const player = (o) => { const a = M.assessPlayer(o); return { ...o, ...a, bars: M.barList(o.signal), hue: hue(o.name), netHue: hue(o.network), initials: o.name.slice(0, 2).toUpperCase(), isOpen: Q.get('tbl') === o.userId, fixes: a.fixes.map((k) => ({ setEmail: { op: 'tblSetEmail', label: 'Set an address', primary: true }, deliver: { op: 'tblDeliver', label: 'Deliver it now', primary: true }, share: { op: 'tblShareContacts', label: 'Share contacts', primary: true } }[k])) }; };
    const players = empty ? [] : [

      player({ userId: 'u3', actorId: 'kiri', name: 'Kiri', playerName: 'Pat', online: true, sceneName: 'Arasaka Tower', you: true, address: 'kiri@nightcity.net', network: 'CitiNet', signal: 45, contacts: 0, unread: 0, held: 1 }),
      player({ userId: 'u4', actorId: 'jo', name: 'Jo', playerName: 'Alex', online: true, sceneName: 'The Afterlife', sceneDead: true, deadZone: true, address: '', network: '', signal: 0, contacts: 2, unread: 0, held: 0 }),
      player({ userId: 'u5', actorId: 'hiro', name: 'Hiro', playerName: 'Dana', online: false, sceneName: '', address: 'hiro@nc.net', network: '', signal: 0, contacts: 3, unread: 4, held: 0 }),
    ];
    const table = { players, scenes: [], hasPlayers: players.length > 0, online: players.filter((p) => p.online).length, need: players.filter((p) => p.needsYou).length };
    const tiles = [
      { tab: 'messages', icon: 'fa-envelope', color: 'var(--ncm-hue-2)', label: 'Messages', n: 42, lines: ['<b>5</b> unread · <b>3</b> today'], bad: '' },
      { tab: 'contacts', icon: 'fa-address-book', color: 'var(--ncm-hue-1)', label: 'Contacts', n: 17, lines: ['<b>2</b> aliases · <b>1</b> group'], bad: '' },
      { tab: 'networks', icon: 'fa-network-wired', color: 'var(--ncm-hue-3)', label: 'Networks', n: 5, lines: ['<b>5</b> live'], bad: '1 dead zone' },
      { tab: 'shards', icon: 'fa-microchip', color: 'var(--ncm-hue-6)', label: 'Shards', n: 6, lines: ['<b>2</b> locked'], bad: '1 bricked' },
      { tab: 'terminals', icon: 'fa-terminal', color: 'var(--ncm-hue-8)', label: 'Terminals', n: 4, lines: ['<b>1</b> logged in'], bad: '' },
      { tab: 'security', icon: 'fa-shield-halved', color: 'var(--ncm-hue-7)', label: 'Security', n: 9, lines: ['events in 24h'], bad: '1 running hot' },
    ];
    ov = { clock: '2045-03-11 23:41', time: '23:41', date: 'Thu 11 Mar 2045', sceneName: 'Arasaka Tower — 7th Floor', sceneDead: Q.get('dead') === '1', nl, table, tiles };
  }
  document.getElementById('out').innerHTML = render({ activeTab: 'overview', ov });
  const over = [...document.querySelectorAll('.ncm-ov2 *')].filter((e) => !e.classList.contains('ncm-ov2-nl__tick') && !e.classList.contains('ncm-ov2-pl__face') /* the tick mark / the online dot + badge sit outside on purpose */).filter((e) => e.scrollWidth > e.clientWidth + 1 && getComputedStyle(e).overflowX === 'visible' && !/ellipsis/.test(getComputedStyle(e).textOverflow) && e.clientWidth > 0).map((e) => String(e.className).split(' ')[0]).slice(0, 6);
  let line = `OK zoom=${ov.nl.zoom} past=${ov.nl.past.length}(+${ov.nl.pastMore}) chips=${ov.nl.chips.length} future=${ov.nl.future.length}(+${ov.nl.later}) · overflow: ${[...new Set(over)].join(', ') || 'none'}`;
  if (Q.get('contrast')) {
    // every visible text node's contrast against the background it really sits on (translucent tints composited down to the first opaque ancestor)
    const cv = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    const rgba = (c) => { cv.clearRect(0, 0, 1, 1); cv.fillStyle = '#000'; cv.fillStyle = c; cv.fillRect(0, 0, 1, 1); const d = cv.getImageData(0, 0, 1, 1).data; const m = /\/\s*([\d.]+%?)\s*\)|rgba\([^)]*,\s*([\d.]+)\)/.exec(c); let a = 1; if (m) { const v = m[1] ?? m[2]; a = v.endsWith('%') ? parseFloat(v) / 100 : parseFloat(v); } if (c === 'transparent') a = 0; return [d[0], d[1], d[2], a]; };
    const over2 = (top, base) => [0, 1, 2].map((i) => top[i] * top[3] + base[i] * (1 - top[3]));
    const lum = (c) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
    const bgOf = (el) => { const layers = []; for (let e = el; e; e = e.parentElement) { const c = rgba(getComputedStyle(e).backgroundColor); if (c[3] > 0) { layers.push(c); if (c[3] >= 0.99) break; } } let base = [0, 0, 0]; for (let i = layers.length - 1; i >= 0; i--) base = i === layers.length - 1 && layers[i][3] >= 0.99 ? layers[i].slice(0, 3) : over2(layers[i], base); return base; };
    const bad = []; let n = 0;
    for (const el of document.querySelectorAll('.ncm-ov2 *')) {
      if (!el.offsetParent || ![...el.childNodes].some((t) => t.nodeType === 3 && t.textContent.trim())) continue;
      const cs = getComputedStyle(el); if (parseFloat(cs.fontSize) === 0 || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;
      if (el.closest('.is-far')) continue;   // faded past rows are deliberately dim (they are history, not information to act on)
      const fg = rgba(cs.color); const bg = bgOf(el); const f = over2(fg, bg);
      const L1 = lum(f), L2 = lum(bg); const r = (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05); n++;
      if (r < 4.5) bad.push(`${r.toFixed(2)} .${String(el.className).split(' ')[0] || el.tagName} "${[...el.childNodes].filter((t) => t.nodeType === 3).map((t) => t.textContent.trim()).join(' ').slice(0, 24)}"`);
    }
    bad.sort();
    line = `CONTRAST ${bad.length}/${n} under 4.5 :: ${bad.slice(0, 30).join(' | ')}`;
  }

} catch (e) { status('ERROR ' + e.message); console.error(e); }
