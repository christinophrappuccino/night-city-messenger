<!--
  ADMIN → NETWORKS, REORGANISED — design mock (2026-10-27).

  The tab mixed "this scene, right now" with "everything in the world": the
  mixer showed every network (even ones that don't exist on the scene you are
  running), Broadcast sat at the bottom, and the catalogue + scene list were
  long scrolls. Split by the question the GM is asking:

    THIS SCENE     the command centre: the scene, its jam switch + default,
                   Broadcast, then ONLY the networks reachable here — each with
                   a horizontal signal slider, who is on it, and on/off.
    ALL NETWORKS   the catalogue: grouped list + detail (where it exists, how
                   you get in, how it behaves, who is on it).
    SCENES         every scene: jammed?, default network, what it carries.
    ACTIVITY LOG   the existing log view, now a sub-tab.

  Click the sub-tabs, rows, chips, toggles. Or:
    ?view=scene|all|scenes|log   ?t=clean-dark|clean-light|high-contrast   ?jam=1   ?sel=<id>
-->

let STEP = Q.get('step') || (NEWNET ? 'identity' : 'access');
function netEditor(n) {

  const start = NEWNET && STEP === 'identity' ? `<div class="ncm-net-admin-start"><span class="k">Start from</span>${[['fa-file', 'Blank'], ['fa-building', 'Corporate'], ['fa-wifi', 'Public'], ['fa-mask', 'Underground'], ['fa-landmark', 'Government'], ['fa-tower-broadcast', 'Custom']].map(([ic2, l], k) => `<span class="ncm-nm2-chip ${k === 1 ? 'on' : ''}" style="${k === 1 ? 'border-color:var(--ncm-secondary)' : ''}"><i class="fas ${ic2}"></i>${l}</span>`).join('')}</div>` : '';
  return `
    <div class="ncm-net-admin-dhead">${NEWNET ? '<span class="ncm-net-admin-ic" style="--c:var(--ncm-secondary)"><i class="fas fa-plus"></i></span>' : ic(n)}
      <div><div class="nm">${NEWNET ? 'New network' : 'Editing ' + n.name}</div><div class="sub ncm-net-admin-stepn">step ${i + 1} of ${STEPS.length} · ${STEPS[i][2]}</div></div>
      <div class="acts">${POP ? '' : btn('Pop out', '', 'fa-up-right-from-square', 'data-pop title="Keep editing in a larger window"')}</div></div>
    <div class="ncm-nm2-steps">${STEPS.map(([k, ic2, l]) => `<span class="ncm-nm2-step ${k === STEP ? 'on' : ''}" data-step="${k}"><i class="fas ${ic2}"></i>${l}</span>`).join('')}</div>
    <div class="ncm-nm2-pscroll"><div class="ncm-nm2-form">${start}${FORM[STEP]}</div></div>
    <div class="ncm-nm2-foot">${prev ? btn(prev[2], '', 'fa-arrow-left', 'data-step="' + prev[0] + '"') : ''}${next ? btn(next[2], '', 'fa-arrow-right', 'data-step="' + next[0] + '"') : ''}<span class="grow"></span>
      ${btn('Cancel', '', '', 'data-editx')}${btn(NEWNET ? 'Create network' : 'Save', 'ncm-term-admin-btn--primary', 'fa-check', 'data-editx')}</div>`;
}
const btn = (label, cls = '', icon = '', attrs = '') => `<button type="button" class="ncm-term-admin-btn ${cls}" ${attrs}>${icon ? `<i class="fas ${icon}"></i>` : ''}${label ? ` ${label}` : ''}</button>`;

const auth = (n) => n.auth === 'open' ? '<span class="ncm-net-admin-auth">Open</span>' : n.auth === 'ice' ? '<span class="ncm-net-admin-auth ice"><i class="fas fa-skull"></i>Black ICE</span>' : '<span class="ncm-net-admin-auth sec"><i class="fas fa-lock"></i>Secured</span>';

        <div class="nm">${x.n}${x.cur ? '<small>the scene you are viewing</small>' : ''}</div>
        <div class="nets">${x.nets.map((id) => `<span style="--c:${net(id).c}"><i class="fas ${net(id).ic}"></i>${net(id).name}<i class="fas fa-xmark rm" data-scrm="${i}:${id}" title="Take ${net(id).name} off this scene"></i></span>`).join('')}
          ${ScopePicker.html('sc' + i, { noun: 'network', nouns: 'networks', icon: 'fa-plus', fixedLabel: x.nets.length ? 'Add' : 'Add networks', multi: true, items: N.filter((y) => !y.global).map((y) => ({ id: y.id, name: y.name, group: y.type, color: y.c, icon: y.ic, meta: y.auth === 'open' ? 'open' : 'secured' })) })}</div>
        <select ${x.jam ? 'disabled' : ''}><option>${x.def}</option></select>
        <span class="ncm-net-admin-sw ${x.jam ? 'on' : ''}" style="${x.jam ? 'background:color-mix(in srgb,var(--ncm-danger) 60%,transparent)' : ''}"></span>
      </div>`).join('')}
    </div>`;
  },

  log: () => `
    <div class="ncm-net-admin-tb"><span class="srch"><i class="fas fa-magnifying-glass"></i><input type="text" placeholder="Search the log…"></span>
      ${ScopePicker.html('netlog', { noun: 'network', nouns: 'networks', icon: 'fa-network-wired', multi: true, items: ALLNETS, countLabel: 'entries', activeLabel: 'In the log' })}${btn('Add entry', '', 'fa-plus')}${btn('', 'ncm-term-admin-btn--icon', 'fa-ellipsis', 'title="Import · Export · Clear"')}</div>
    <div class="ncm-net-admin-log">${(() => { const v = ScopePicker.value('netlog'); return LOGROWS.filter((r) => !v.length || v.includes(r[4])); })()
      .map(([w, c, i, t, n]) => `<div class="ncm-net-admin-logrow" style="--c:${c}"><span class="w">${w}</span><i class="fas ${i}"></i><span>${t}</span><span class="net" data-lognet="${n}" title="Show only ${n}" style="cursor:pointer">${n}</span></div>`).join('')}</div>`,
};
const HEAD = {
  scene: ['This scene', 'The scene you’re running: its signal, its networks, and who’s on them.'],
  all: ['All networks', 'Every network in the world, where it exists, and how you get in.'],
  scenes: ['Scenes', 'Which networks each scene carries, where players start, and which are dead zones.'],
  log: ['Activity log', 'Connections, bypasses, ICE strikes and broadcasts, newest first.'],
};
const NOTES = {
  scene: '<h3>This scene</h3><p>The command centre, and the default view. Everything here is about the scene you are running: pick another scene from its name.</p><p><b>Broadcast sits right under the scene</b>, and can go to everyone online, everyone on this scene, or one network.</p><p><b>Only the networks reachable here</b> are listed — global ones plus the ones this scene carries. Each has a horizontal signal slider (scales to any number of networks, unlike the side-scrolling mixer), its players as avatars (click to move one), and an on/off switch. Global networks are always on.</p><p>Players on a network this scene can\'t reach show in one line at the bottom.</p>',
  get all() { return (EDIT ? '<h3>Editing in place</h3><p><b>The Network Manager is folded into this tab.</b> Edit turns the detail pane into its six-step editor — Identity · Signal · Access · Behaviour · Where · Look — with the list still on the left. Back / Next walk the steps; any step is one click; everything saves together.</p><p><b>New network</b> opens the same editor on Identity with <b>Start from</b>: blank or a type preset (this replaces the old quick-create buttons).</p><p><b>Pop out</b> opens the same view in a larger window (<b>?pop=1</b>) — the scene-controls button and any macro that opened the Network Manager open this instead, so nobody loses their way in.</p>' : '') + '<h3>All networks</h3><p>The full catalogue, list + detail like Terminals and Shards. Grouped by type; filters answer "what\'s on this scene", "what\'s secured", "what\'s everywhere", "who\'s in use", "what\'s switched off".</p><p>The detail says where a network exists, how you get in (per-skill DVs included), how it behaves (traced, anonymous, delayed) and who is on it.</p>'; },
  scenes: '<h3>Scenes</h3><p>Every scene on one screen: what it carries, where players start, and a dead-zone switch — and now <b>the networks are edited right on the row</b>: ✕ takes one off, <b>Add</b> opens the scope picker to put several on. The Network Manager’s Scenes tab is no longer needed.</p>',
  log: '<h3>Activity log</h3><p>The existing log, promoted from a button to a sub-tab. Import, export and clear move into ⋯.</p><p><b>Network filter = the scope picker</b>, not a dropdown: search, a chip per network type, an "In the log" chip, the busiest networks first with their entry count, and pick several at once. Click a network name on any row to filter to it.</p><p>The same picker is used for the scene name, the broadcast target, and the Network Manager\'s log and note target.</p>',
};

function render() {
  document.getElementById('panel').classList.toggle('pop', POP);
  const nav = [['scene', 'fa-location-crosshairs', 'This scene', N.filter((n) => n.global || n.here).length], ['all', 'fa-network-wired', 'All networks', N.length], ['scenes', 'fa-map', 'Scenes', SCENES.length], ['log', 'fa-scroll', 'Activity log', 0]];
  document.getElementById('content').innerHTML = `
    <div class="ncm-net-admin-nav">${nav.map(([k, i, l, n]) => `<button type="button" class="ncm-net-admin-navbtn ${VIEW === k ? 'on' : ''}" data-view="${k}"><i class="fas ${i}"></i>${l}${n ? `<span class="ncm-net-admin-navct">${n}</span>` : ''}</button>`).join('')}
      <span class="grow"></span>${btn('New network', 'ncm-term-admin-btn--primary', 'fa-plus', 'data-newnet')}${POP ? '' : btn('', 'ncm-term-admin-btn--icon', 'fa-up-right-from-square', 'data-pop title="Pop out: open Networks in its own larger window — the scene-controls button opens this too"')}</div>
    <div class="ncm-net-admin-view ${VIEW === 'all' ? 'split' : ''}">${viewHd(...HEAD[VIEW])}${VIEWS[VIEW]()}</div>`;
  document.getElementById('notes').innerHTML = NOTES[VIEW];
  ScopePicker.after();
}
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-newnet]')) { VIEW = 'all'; EDIT = true; NEWNET = true; STEP = 'identity'; render(); return; }
  if (e.target.closest('[data-edit]')) { EDIT = true; NEWNET = false; STEP = 'identity'; render(); return; }
  if (e.target.closest('[data-editx]')) { EDIT = false; NEWNET = false; render(); return; }
  const stp = e.target.closest('[data-step]'); if (stp) { STEP = stp.dataset.step; render(); return; }
  if (e.target.closest('[data-pop]')) { POP = true; render(); return; }
  if (e.target.closest('[data-dock]')) { POP = false; render(); return; }
  const rm = e.target.closest('[data-scrm]'); if (rm) { const [i, id] = rm.dataset.scrm.split(':'); SCENES[+i].nets = SCENES[+i].nets.filter((x) => x !== id); render(); return; }
  const v = e.target.closest('[data-view]'); if (v) { VIEW = v.dataset.view; render(); return; }
  const r = e.target.closest('.ncm-net-admin-r'); if (r) { SEL = r.dataset.id; EDIT = false; NEWNET = false; render(); return; }
  const f = e.target.closest('[data-filter]'); if (f) { FILTER = f.dataset.filter; render(); return; }
  const ln = e.target.closest('[data-lognet]'); if (ln) { ScopePicker.set('netlog', [ln.dataset.lognet]); render(); return; }
  if (e.target.closest('[data-jam]')) { JAM = !JAM; render(); }
});
render();

const link = (k, v, label) => { const q = new URLSearchParams(location.search); if (v === null) q.delete(k); else q.set(k, v); const on = (Q.get(k) ?? null) === v; return `<a class="${on ? 'on' : ''}" href="?${q}">${label}</a>`; };
document.getElementById('bar').innerHTML = `<b>NETWORKS TAB — REDESIGN</b>
  <span>view</span>${link('view', null, 'this scene')}${link('view', 'all', 'all networks')}${link('view', 'scenes', 'scenes')}${link('view', 'log', 'log')}
  <span>preset</span>${link('t', null, 'clean-dark')}${link('t', 'clean-light', 'clean-light')}${link('t', 'high-contrast', 'high-contrast')}
  <span>state</span>${link('jam', '1', 'dead zone')}${link('edit', '1', 'editing')}${link('new', '1', 'new network')}${link('pop', '1', 'pop-out')}${link('pick', 'log', 'log picker')}${link('pick', 'scene', 'scene picker')}${link('pick', 'bcast', 'broadcast picker')}`;
</script>
</body>
</html>
