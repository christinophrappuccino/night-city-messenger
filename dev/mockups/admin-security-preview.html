<script>
const qs = new URLSearchParams(location.search);
if (qs.get('t')) document.getElementById('p').setAttribute('data-ncm-admin-theme', qs.get('t'));
// ?h=600 renders at the panel's REAL height (AdminPanelApp is 820x600) instead of the
// tall full-page frame — pair with ?focus= to inspect a region as the GM sees it.

const EMPTY = qs.get('empty') === '1';

// helpers the admin panel registers for real
Handlebars.registerHelper('ncm-hue', (t) => { const s = String(t ?? '').trim().toLowerCase(); if (!s) return 'var(--ncm-text-label)'; let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return 'var(--ncm-hue-' + ((h % 8) + 1) + ')'; }); // mirrors scripts/utils/tagHue.js
Handlebars.registerHelper('eq', (a, b) => a === b);
Handlebars.registerHelper('gt', (a, b) => a > b);
Handlebars.registerHelper('letter', (i) => String.fromCharCode(65 + (((i || 0) % 26) + 26) % 26));

const IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="36" height="36" fill="#456"/></svg>');

const row = (o) => Object.assign({

  objectName: 'ARASAKA-WS', objectId: 'o1', targetKind: 'terminal', targetIcon: 'fa-terminal',
  targetCls: 'terminal', targetUuid: 'Item.x', roll: '9 vs 20', sev: 'hostile', sevLabel: 'Break-in',
  heatDelta: 35, heat: 72, heatTier: 'hot', isFail: true, isNew: false, canOpen: true, agoStr: '2m ago',
}, o);

const ctx = {
  activeTab: 'security',
  security: {
    stats: { traces24h: 37, hot: 2, plants: 3, recycle: 5 },
    log: {
      newCount: EMPTY ? 0 : 3, filter: 'all', search: '', activeFilter: '',
      page: 1, maxPage: 3, total: 37, hasPrev: false, hasNext: true, alertLevel: 'serious',
      rows: EMPTY ? [] : [
        row({ isNew: true, netVerb: 'Control' }),
        row({ id: 'r2', isNew: true, agoStr: '14m ago', actionLabel: 'Siphoned an account', isFail: false, netVerb: 'Control',
              objectName: 'Militech ••7', targetKind: 'bank', targetIcon: 'fa-building-columns', targetCls: 'bank', roll: '18 vs 15' }),
        row({ id: 'r3', agoStr: '1h ago', actorName: 'Rache Bartmoss', actionLabel: 'Fumbled a shard password', sev: 'minor',
              objectName: 'redacted.shard', targetKind: 'shard', targetIcon: 'fa-sd-card', targetCls: 'shard',
              roll: '—', heat: 10, heatTier: 'cold', canOpen: false }),
        row({ id: 'r4', agoStr: '2h ago', actorName: 'Rache Bartmoss', actionLabel: 'Failed a network bypass',
              objectName: 'CitiNet node 4', targetKind: 'network', targetIcon: 'fa-tower-broadcast', targetCls: 'network',
              roll: '8 vs 17', heat: 35, heatTier: 'warm' }),
      ],
    },
    heat: {
      hot: EMPTY ? [] : [
        { actorName: 'V', actorId: 'a1', objectName: 'ARASAKA-WS', objectId: 'o1', value: 72, tier: 'hot', canEscalate: true },
        { actorName: 'Rache Bartmoss', actorId: 'a2', objectName: 'CitiNet node 4', objectId: 'o2', value: 35, tier: 'warm', canEscalate: false },
      ],
      coolingCount: EMPTY ? 0 : 6,
      pager: { page: 1, maxPage: EMPTY ? 1 : 2, hasPrev: false, hasNext: !EMPTY, total: EMPTY ? 0 : 10, multi: !EMPTY },
    },
    plants: EMPTY ? [] : [
      { id: 'p1', itemId: 'i1', name: 'affair.chat', forge: 'forgery 74% · scan DV 15', hostName: 'ARASAKA-WS',
        by: 'V', trigger: 'on next login', state: 'armed', isPlant: true },
      { id: 'p2', itemId: 'i2', name: 'backdoor.exe', forge: 'forgery 41% · scan DV 11', hostName: 'NETWATCH-UNIT',
        by: 'Rache Bartmoss', trigger: 'when someone reads mail', state: 'fired', isPlant: false },
    ],
    plantsPager: { page: 1, maxPage: EMPTY ? 1 : 2, hasPrev: false, hasNext: !EMPTY, total: EMPTY ? 0 : 9, multi: !EMPTY },
    bin: EMPTY ? [] : [
      { id: 'b1', pageName: 'access.log', hostName: 'NETWATCH-UNIT ▸ root', wipedByName: 'V', agoStr: '1h ago' },
    ],
    binPager: { page: 1, maxPage: EMPTY ? 1 : 2, hasPrev: false, hasNext: !EMPTY, total: EMPTY ? 0 : 14, multi: !EMPTY },
    net: { mode: 'gm', isAuto: false, isFlagged: false, isGm: true },
    gate: {
      mode: 'gated', logic: 'any', roleLogic: 'any',
      roleChips: [{ name: 'Netrunner', img: IMG }],
      availableRoles: [{ name: 'Netrunner', img: IMG }, { name: 'Tech', img: IMG }],
      skillName: 'Interface', skillMin: 4,
      skillOptions: ['Interface', 'Electronics/Security Tech', 'Cryptography'],
      groups: [[{ name: 'Cyberdeck', img: IMG }, { name: 'Interface Plugs', img: IMG }], [{ name: 'Agent', img: IMG }]],
      availableItems: [{ name: 'Cyberdeck', img: IMG }, { name: 'Agent', img: IMG }],
      allowGM: true,
    },
  },

// ?diag=1 — measure the rendered result instead of eyeballing it. Dumps into
// <pre id="diag"> so `chrome --dump-dom` can read it. Reports horizontal overflow,
// multi-line wrapping, and computed text-align (Foundry/CPR center text by default).
function diag() {
  const out = [];
  const probe = (label, sel) => {
    document.querySelectorAll(sel).forEach((el, i) => {
      const cs = getComputedStyle(el);
      const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.2;
      // clientHeight INCLUDES padding — subtract it or every padded cell reads as
      // "wrapping" and you chase phantom bugs. Measure the text box, not the box.
      const content = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const lines = Math.round(content / lh);
      const flags = [];
      if (el.scrollWidth > el.clientWidth + 1) flags.push(`OVERFLOW-X(${el.scrollWidth}>${el.clientWidth})`);
      if (lines > 1 && el.children.length === 0 && el.textContent.trim()) flags.push(`WRAPS(${lines} lines)`);
      if (cs.textAlign !== 'left' && cs.textAlign !== 'start') flags.push(`text-align:${cs.textAlign}`);
      if (flags.length) out.push(`${label}[${i}] "${el.textContent.trim().slice(0, 26)}" ${flags.join(' ')}`);
    });
  };
  // header rows: children sharing an offsetTop are on one line. >1 distinct top = wrapped.
  out.push('HEADER LINES (1 = fits on one row at this width)');
  // children are center-aligned, so offsetTop differs per child ON THE SAME ROW —
  // count row BANDS instead (a new row starts once a child begins below the last band).
  document.querySelectorAll('.ncm-sec-admin-card__hd').forEach((h, i) => {
    const kids = [...h.children].filter(c => c.offsetWidth)
      .map(c => c.getBoundingClientRect()).sort((a, b) => a.top - b.top);
    let rows = 0, bandBottom = -Infinity;
    for (const r of kids) if (r.top >= bandBottom - 1) { rows++; bandBottom = r.bottom; }
      else bandBottom = Math.max(bandBottom, r.bottom);
    const title = h.querySelector('h3')?.textContent.trim();
    out.push(`  hd[${i}] "${title}" rows=${rows}${rows > 1 ? '  <== WRAPPED' : ''}`);
    if (i === 0) [...h.children].forEach(c => out.push(
      `      ${c.tagName.toLowerCase()}.${(c.className||'').toString().split(' ')[0]} ` +
      `top=${c.getBoundingClientRect().top.toFixed(0)} bot=${c.getBoundingClientRect().bottom.toFixed(0)} w=${c.offsetWidth} "${c.textContent.trim().slice(0,12)}"`));
  });
  out.push('');

  // is anything wider than the box that clips it?
  out.push('WIDTHS');
  document.querySelectorAll('.ncm-sec-admin-card').forEach((c, i) => {
    const t = c.querySelector('.ncm-sec-admin-table');
    out.push(`  card[${i}] client=${c.clientWidth} scroll=${c.scrollWidth}` +
      (t ? ` | table client=${t.clientWidth} scroll=${t.scrollWidth} offset=${t.offsetWidth}` +
           (t.scrollWidth > c.clientWidth ? '  <== TABLE WIDER THAN CARD' : '') : ''));
  });
  const cont = document.querySelector('.ncm-admin-content');
  out.push(`  admin-content client=${cont.clientWidth} scroll=${cont.scrollWidth}`);
  // who actually sticks out past the card's right edge?
  document.querySelectorAll('.ncm-sec-admin-card').forEach((c, i) => {
    const edge = c.getBoundingClientRect().right;
    c.querySelectorAll('*').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.right > edge + 0.5 && r.width > 0)
        out.push(`  card[${i}] OUTSIDE by ${(r.right - edge).toFixed(1)}px: ${el.tagName.toLowerCase()}.${(el.className||'').toString().split(' ')[0]} "${el.textContent.trim().slice(0,18)}"`);
    });
  });
  out.push('');

  probe('card__hd', '.ncm-sec-admin-card__hd');
  probe('card__hd h3', '.ncm-sec-admin-card__hd h3');
  probe('newbadge', '.ncm-sec-admin-newbadge');
  probe('fchip', '.ncm-sec-admin-fchip');
  probe('td', '.ncm-sec-admin-table td');
  probe('th', '.ncm-sec-admin-table th');
  probe('heat.who', '.ncm-sec-admin-heat .who');
  probe('heat.obj', '.ncm-sec-admin-heat .obj');
  probe('prow.t', '.ncm-sec-admin-prow .t');
  probe('prow.d', '.ncm-sec-admin-prow .d');
  probe('frow>label', '.ncm-sec-admin-frow > label');
  probe('sec-check', '.ncm-sec-admin-check');
  probe('addrole', '.ncm-sec-admin-addrole');
  probe('additem', '.ncm-sec-admin-additem');
  probe('frow select', '.ncm-sec-admin-frow select');

  // Which rule wins? MUST recurse into @layer / @media / @supports grouping rules —
  // foundry2.css is entirely @layer-based, so a flat top-level scan finds nothing
  // and every real culprit reads as "(no matching rule)".
  const rulesFor = (el, prop) => {
    const hits = [];
    const walk = (rules, where) => {
      for (const r of rules || []) {
        if (r.styleSheet) { walk(r.styleSheet.cssRules, (r.href || '').split('/').pop() + ' '); continue; }
        if (r.cssRules) { walk(r.cssRules, where + (r.name ? `@layer ${r.name} ` : r.conditionText ? `@${r.conditionText} ` : '')); continue; }
        if (!r.style || !r.selectorText || !r.style.getPropertyValue(prop)) continue;
        let m = false; try { m = el.matches(r.selectorText); } catch { m = false; }
        if (m) hits.push(`${where}{ ${r.selectorText} } => ${r.style.getPropertyValue(prop)}${r.style.getPropertyPriority(prop) ? ' !important' : ''}`);
      }
    };
    for (const sh of document.styleSheets) {
      let rules; try { rules = sh.cssRules; } catch { continue; }
      walk(rules, (sh.href || 'inline').split('/').pop() + ' ');
    }
    return hits;
  };
  const trace = (sel, prop) => {
    const el = document.querySelector(sel); if (!el) return;
    out.push(`\nTRACE ${sel} {${prop}} computed=${getComputedStyle(el)[prop]}\n  `
      + (rulesFor(el, prop).join('\n  ') || '(no matching rule — inherited)'));
  };
  trace('.ncm-sec-admin-table td', 'text-align');
  trace('.ncm-sec-admin-check', 'text-transform');
  trace('.ncm-sec-admin-check', 'font-size');
  trace('.ncm-sec-admin-check input[type=checkbox]', 'width');

  // inherited props have no matching rule on the element — walk up to find the source
  const inherit = (sel, prop) => {
    let el = document.querySelector(sel); if (!el) return;
    out.push(`\nINHERIT-CHAIN ${sel} {${prop}}`);
    for (; el && el !== document.documentElement; el = el.parentElement) {
      const hits = rulesFor(el, prop);
      const tag = `${el.tagName.toLowerCase()}.${(el.className || '').toString().split(' ').filter(Boolean).join('.')}`;
      out.push(`  ${tag} => ${getComputedStyle(el)[prop]}` + (hits.length ? `\n      SET BY: ${hits.join('\n      SET BY: ')}` : ''));
    }
  };
  inherit('.ncm-sec-admin-table td', 'text-align');
  inherit('.ncm-sec-admin-check', 'text-transform');

  // sheet inventory — an unreadable sheet is silently skipped above, which reads
  // as "no rule" and sends you hunting in the wrong file.
  out.push('\nSHEETS');
  for (const sh of document.styleSheets) {
    let n = null, err = '';
    try { n = (sh.cssRules || []).length; } catch (e) { err = ' UNREADABLE: ' + e.name; }
    out.push(`  ${(sh.href || 'inline').split('/').pop()} rules=${n}${err}`);
  }
  // every text-align rule anywhere, matching or not
  out.push('\nALL text-align RULES');
  const dump = (rules, where) => {
    for (const r of rules || []) {
      if (r.styleSheet) { dump(r.styleSheet.cssRules, (r.href || '').split('/').pop() + ' '); continue; }
      if (r.cssRules) { dump(r.cssRules, where + (r.name ? `@layer ${r.name} ` : r.conditionText ? `@${r.conditionText} ` : '')); continue; }
      if (r.style && r.selectorText && r.style.getPropertyValue('text-align'))
        out.push(`  ${where}{ ${r.selectorText} } => ${r.style.getPropertyValue('text-align')}`);
    }
  };
  for (const sh of document.styleSheets) {
    let rules; try { rules = sh.cssRules; } catch { continue; }
    dump(rules, (sh.href || 'inline').split('/').pop() + ' ');
  }

  const pre = document.createElement('pre');
  pre.id = 'diag'; pre.textContent = out.join('\n');
  document.body.appendChild(pre);
}

// ?ctx=<url of a JSON dump>&key=<view>  renders a REAL SecurityTab context instead of the
// hand-built one above — e.g. NCM_DUMP=dump.json node dev/tools/sims/test-security-modules.mjs
// writes { activity, activityPicked, heat } (the seismograph + thermometers as the tab builds them).
const ctxUrl = qs.get('ctx');
const ctxReady = ctxUrl
  ? fetch(ctxUrl).then(r => r.json()).then(j => { ctx.security = j[qs.get('key') || 'activity'] || j; })
  : Promise.resolve();
ctxReady.then(() => fetch('../../templates/admin-panel/tab-security.hbs'))
  .then(r => r.text())
  .then(src => {
    document.getElementById('out').innerHTML = Handlebars.compile(src)(ctx);
    document.getElementById('status').textContent = 'rendered REAL template' + (EMPTY ? ' (empty states)' : '');
    document.body.dataset.ready = '1';
    // ?focus=<selector> scrolls a region into view so a short window can screenshot it
    const f = qs.get('focus');
    if (f) document.querySelector(f)?.scrollIntoView({ block: 'center' });
    if (qs.get('diag') === '1') diag();
  })
  .catch(e => { document.getElementById('status').textContent = 'FETCH FAILED: ' + e
     + ' — run chrome with --allow-file-access-from-files'; });
</script>
</body></html>
