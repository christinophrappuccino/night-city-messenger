function dirList() {
  const f = FILTERS.find((x) => x[0] === FILTER)[2];

  knows: PCS.map((p) => p[0]).filter((p, j) => (i * 7 + j * 3) % 5 === 0) }))];
let MXOPEN = new Set(Q.get('mxopen') === 'all' ? EXTRA_ROLES.concat(['System', 'Exec']) : ['Fixer']);
let MXF = Q.get('mxf') || 'all';
let MXQ = '';
const MXCHG = [];                 // [{cid, pid, on}] this session, for Undo
let MXLAST = null;                // last clicked cell, for shift-click ranges
const MXFILTERS = [['all', 'All', () => true], ['none', 'Nobody knows', (c) => !c.knows.length], ['some', 'Some know', (c) => c.knows.length && c.knows.length < PCS.length],

function mxRows() {
  const f = MXFILTERS.find((x) => x[0] === MXF)[2], q = MXQ.trim().toLowerCase();
  return MX.filter((c) => f(c) && (!q || (c.name + ' ' + c.addr + ' ' + c.role + ' ' + (c.org || '')).toLowerCase().includes(q)));

function mxToggle(cid, pid, force) {
  const c = MX.find((x) => x.id === cid), has = c.knows.includes(pid), on = force === undefined ? !has : force;

  const open = (r) => q || MXF !== 'all' || MXOPEN.has(r);

    const inG = rows.filter((c) => c.role === r).flatMap((c) => c.alias ? [] : [c, ...rows.filter((a) => a.of === c.id)]);
    const aliasHits = rows.filter((c) => c.alias && c.role === r && !inG.includes(c));
    const list = [...inG, ...aliasHits];
    if (!list.length) return '';
    const tally = cols.map(([pid]) => { const k = list.filter((c) => c.knows.includes(pid)).length;
      return `<td><span class="ncm-ct2-tally ${k === list.length ? 'all' : k ? 'some' : ''}" data-gtally="${r}:${pid}" title="${k === list.length ? 'Take every ' + r + ' back from' : 'Share every ' + r + ' with'} ${pid === 'v' ? 'V' : pid[0].toUpperCase() + pid.slice(1)}">${k}/${list.length}</span></td>`; }).join('');
    return `<tr class="grp" data-grp="${r}"><th><i class="fas fa-chevron-${open(r) ? 'down' : 'right'} chev"></i>${PLURAL(r)}<span class="n">${list.length}</span></th>${tally}</tr>`
      + (open(r) ? list.map((c) => `<tr><th>${c.alias ? '<span style="color:var(--ncm-text-muted);margin-right:4px">└</span>' : ''}${c.name}<small>${c.addr}</small></th>${cols.map(([pid]) => `<td><span class="ncm-ct2-cell ${c.knows.includes(pid) ? 'on' : ''} ${MXCHG.some((x) => x.cid === c.id && x.pid === pid) ? 'chg' : ''}" data-cell="${c.id}:${pid}"><i class="fas fa-check"></i></span></td>`).join('')}</tr>`).join('') : '');
  }).join('');
  const nchg = new Set(MXCHG.map((x) => x.cid + ':' + x.pid)).size;
  return `
  <div class="ncm-ct2-tb"><span class="srch"><i class="fas fa-magnifying-glass"></i><input type="text" data-mxq value="${MXQ.replace(/"/g, '&quot;')}" placeholder="Find a contact — name, address, role, organisation…"></span>
    ${ScopePicker.html('mxcols', { noun: 'character', nouns: 'characters', icon: 'fa-user', label: 'Columns', multi: true, allLabel: 'All characters',
      items: PCS.map(([id, n, col, user]) => ({ id, name: n, color: col, icon: 'fa-user', group: 'Players’ characters', meta: 'played by ' + user, count: MX.filter((c) => c.knows.includes(id)).length })), countLabel: 'contacts known', activeLabel: 'Know anyone' })}
    <select><option>Group: Role</option><option>Group: Organisation</option></select></div>
  <div class="ncm-ct2-chips">${MXFILTERS.map(([k, l, fn]) => `<span class="ncm-ct2-chip ${k === MXF ? 'on' : ''}" data-mxf="${k}">${l}<span class="n">${MX.filter(fn).length}</span></span>`).join('')}
    <span style="flex:1"></span><span class="ncm-ct2-chip" data-mxall="${MXOPEN.size ? 'close' : 'open'}"><i class="fas fa-${MXOPEN.size ? 'compress' : 'expand'}"></i>${MXOPEN.size ? 'Collapse all' : 'Expand all'}</span></div>
  <div class="ncm-ct2-mx">${body ? `<table class="ncm-ct2-mxt">
    <thead><tr><th>${rows.length} contact${rows.length === 1 ? '' : 's'}</th>${cols.map(([id, n, col]) => `<th><img src="${FACE(col)}" alt="">${n}<small>knows ${MX.filter((c) => c.knows.includes(id)).length}</small></th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table>` : `<div class="ncm-ct2-mxempty">No contact matches. <a data-mxreset>Show everyone</a></div>`}</div>
  <div class="ncm-ct2-mxbar">${nchg ? `<span class="chg"><i class="fas fa-pen"></i> ${nchg} change${nchg === 1 ? '' : 's'} this session</span><a data-mxundo>Undo last</a>` : '<span>Changes save as you click.</span>'}
    <span class="grow"></span><span><kbd>Shift</kbd>-click fills a column range · a group’s <b>n/m</b> shares or takes back the whole group</span></div>`;
}

const NOTES = {
  get directory() { return (EDIT ? '<h3>Editing in place</h3><p><b>The Contact Manager window is folded into this tab.</b> Edit turns the detail pane into the form — the list stays on the left, so you never lose your place.</p><p>Five sections, jumped to from the strip (it follows your scroll): <b>Identity</b> (portrait, name, subtitle, role chips + Manage roles, org, location, tags, linked character, folder) · <b>Addresses & aliases</b> (address, phone, two-way / send-only, identities with ★ main + Add an alias) · <b>Security & ICE</b> · <b>Trust</b> (default + per-player override) · <b>Notes</b>.</p><p>A section you changed gets a dot; Save and Cancel are pinned. Clicking another contact with unsaved edits asks first (<b>?guard=1</b>).</p><p><b>Pop out</b> opens the same view in a larger window (<b>?pop=1</b>): same code, so the two can never drift again.</p>' : '') + (POP ? '<h3>Pop-out window</h3><p>The whole Contacts tab, at 1120px: wider list, and the editor lays its sections out in two columns. "Back to the admin panel" closes it and returns you to the tab on the same contact.</p>' : '') + '<h3>Directory</h3><p>The NPCs, list + detail like the other tabs. Grouped by role (or organisation, trust, none). <b>Aliases sit under their main identity</b>, so a character\'s burners are never scattered.</p><p>Each row shows <b>mail waiting</b> (gold), encrypted, needs-a-look, and coloured dots for <b>which players know them</b>.</p><p>The detail, top to bottom: anything that needs fixing (auto-added, shared address), mail waiting with <b>Reply as</b>, <b>who knows them — click a portrait to share or take back</b>, trust per player, identities (star = main, + alias), details, GM notes.</p><p>The Send-as strip stays above the list. New contact covers blank / from an actor / import.</p>'; },
  players: '<h3>Players</h3><p>Each player character: their address (warns when they have none), who they know, which groups they hold, their identities — and buttons for their inbox and their own Contacts window.</p>',
  groups: '<h3>Groups</h3><p>The contact groups as their own view: members with portraits, and <b>who they\'re pushed to — click to push or take back</b>. Message the whole group from here.</p>',
  matrix: '<h3>Who knows whom</h3><p>Every contact down the side, every character across the top, one click per cell. Built for a campaign with ~50 contacts (this mock has 50).</p><p><b>Groups fold.</b> Only the groups you open show rows; a closed group is one line with a <b>n/m tally per character</b> — click it to share the whole group with that character (or take it back when they already have all of it). Searching or filtering opens every group that has a hit.</p><p><b>Filters answer the session-prep questions:</b> Nobody knows · Some know · Everyone knows · Changed this session.</p><p><b>Columns</b> is the scope picker, for tables with many characters. The name column and the header stay put while you scroll.</p><p>Shift-click fills a range in one column; changed cells are outlined and <b>Undo last</b> walks them back.</p>',
};

function render() {
  document.getElementById('panel').classList.toggle('pop', POP);
  const counts = Object.fromEntries(FILTERS.map(([k, , f]) => [k, C.filter((c) => !c.alias && f(c)).length]));
  const nav = [['directory', 'fa-address-book', 'Directory', C.filter((c) => !c.alias).length], ['players', 'fa-user', 'Players', PCS.length], ['groups', 'fa-users', 'Groups', G.length], ['matrix', 'fa-table-cells', 'Who knows whom', 0]];
  document.getElementById('content').innerHTML = `
    <div class="ncm-ct2-nav">${nav.map(([k, i, l, n]) => `<button type="button" class="ncm-ct2-navbtn ${VIEW === k ? 'on' : ''}" data-view="${k}"><i class="fas ${i}"></i>${l}${n ? `<span class="ncm-ct2-navct">${n}</span>` : ''}</button>`).join('')}
      <span class="grow"></span>${btn('New', 'ncm-term-admin-btn--primary', 'fa-plus', 'data-new')}${POP ? '' : btn('Pop out', '', 'fa-up-right-from-square', 'title="Open Contacts in its own larger window — handy beside a scene or on a second screen" data-pop')}
      <div class="ncm-ct2-menu ${NEWM ? 'open' : ''}">
        <div class="it"><i class="fas fa-user-plus"></i>New contact</div>
        <div class="it"><i class="fas fa-person-circle-plus"></i>From an actor…<small>name, portrait, role</small></div>
        <div class="it"><i class="fas fa-users"></i>New group</div>
        <hr><div class="it"><i class="fas fa-file-import"></i>Import from JSON…</div><div class="it"><i class="fas fa-file-export"></i>Export all</div>
        <div class="it"><i class="fas fa-users-between-lines"></i>Sync from actors<small>add every NPC actor</small></div>
      </div></div>
    <div class="ncm-ct2-view">${VIEW === 'directory' ? `
      <div class="ncm-ct2-sendas"><span class="lbl"><i class="fas fa-paper-plane"></i>Send as</span>${C.filter((c) => c.face).slice(0, 5).map((c) => `<span class="ncm-ct2-qs">${c.face ? `<img src="${FACE(c.face)}" alt="">` : ''}${c.name.split(' ')[0]}</span>`).join('')}</div>
      <div class="ncm-ct2-tb"><span class="srch"><i class="fas fa-magnifying-glass"></i><input type="text" placeholder="Search name, address, organisation, tag, notes…"></span>
        <select><option>Group: Role</option><option>Group: Organisation</option><option>Group: Trust</option><option>Group: None</option></select><select><option>Sort: A–Z</option><option>Sort: Recent mail</option></select></div>
      <div class="ncm-ct2-chips">${FILTERS.map(([k, l]) => `<span class="ncm-ct2-chip ${k === FILTER ? 'on' : ''} ${k === 'check' || k === 'mail' ? 'warn' : ''}" data-filter="${k}">${l}<span class="n">${counts[k]}</span></span>`).join('')}</div>
      ${GUARD ? `<div class="ncm-ct2-guard"><i class="fas fa-circle-exclamation" style="color:var(--ncm-accent)"></i><span>You have unsaved changes to <b>${(C.find((x) => x.id === SEL) || C[0]).name}</b>.</span><span class="grow"></span>${btn('Keep editing', '', '', 'data-guard="stay"')}${btn('Discard', '', '', 'data-guard="discard"')}${btn('Save and open', 'ncm-term-admin-btn--primary', 'fa-check', 'data-guard="save"')}</div>` : ''}
      <div class="ncm-ct2-split"><div class="ncm-ct2-list">${dirList()}</div><div class="ncm-ct2-det ${EDIT ? 'editing' : ''}">${EDIT ? dirEdit() : dirDetail()}</div></div>`
      : VIEW === 'players' ? playersView() : VIEW === 'groups' ? groupsView() : matrixView()}</div>`;
  document.getElementById('notes').innerHTML = NOTES[VIEW];
  ScopePicker.after();
}
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-editor]')) { EDIT = true; render(); return; }
  if (e.target.closest('[data-pop]')) { POP = true; render(); return; }
  if (e.target.closest('[data-dock]')) { POP = false; render(); return; }
  if (e.target.closest('[data-edcancel]') || e.target.closest('[data-edsave]')) { EDIT = false; DIRTY.clear(); render(); return; }
  const gd = e.target.closest('[data-guard]'); if (gd) { if (gd.dataset.guard !== 'stay') { SEL = GUARD; EDIT = false; DIRTY.clear(); } GUARD = null; render(); return; }
  const et = e.target.closest('[data-edtab]'); if (et) { document.querySelector('[data-esec="' + et.dataset.edtab + '"]')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  const es = e.target.closest('[data-edseg]'); if (es) { const k = es.dataset.edseg; if (k in ED) ED[k] = isNaN(+es.dataset.v) ? es.dataset.v : +es.dataset.v; DIRTY.add(es.closest('[data-esec]').dataset.esec); render(); return; }
  const er = e.target.closest('[data-edrole]'); if (er) { ED.role = er.dataset.edrole; DIRTY.add('identity'); render(); return; }
  if (e.target.closest('[data-edenc]')) { ED.enc = !ED.enc; DIRTY.add('security'); render(); return; }
  if (EDIT && DIRTY.size) { const row = e.target.closest('.ncm-ct2-r[data-id]'); if (row && row.dataset.id !== SEL) { GUARD = row.dataset.id; render(); return; } }
  if (EDIT && !DIRTY.size && e.target.closest('.ncm-ct2-r[data-id]')) { EDIT = false; }
  const v = e.target.closest('[data-view]'); if (v) { VIEW = v.dataset.view; render(); return; }
  const r = e.target.closest('.ncm-ct2-r[data-id]'); if (r) { SEL = r.dataset.id; render(); return; }
  const p = e.target.closest('[data-p]'); if (p) { PSEL = p.dataset.p; render(); return; }
  const g = e.target.closest('[data-g]'); if (g) { GSEL = g.dataset.g; render(); return; }
  const f = e.target.closest('[data-filter]'); if (f) { FILTER = f.dataset.filter; render(); return; }
  const k = e.target.closest('[data-pc]'); if (k) { const c = C.find((x) => x.id === SEL); const i = c.knows.indexOf(k.dataset.pc); i < 0 ? c.knows.push(k.dataset.pc) : c.knows.splice(i, 1); render(); return; }
  const cell = e.target.closest('[data-cell]'); if (cell) {
    const [cid, pid] = cell.dataset.cell.split(':');
    if (e.shiftKey && MXLAST && MXLAST.pid === pid) {
      const ids = [...document.querySelectorAll('[data-cell$=":' + pid + '"]')].map((x) => x.dataset.cell.split(':')[0]);
      const a = ids.indexOf(MXLAST.cid), b = ids.indexOf(cid), on = MX.find((x) => x.id === MXLAST.cid).knows.includes(pid);
      ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach((id) => mxToggle(id, pid, on));
    } else mxToggle(cid, pid);
    MXLAST = { cid, pid }; render(); return; }
  const gt = e.target.closest('[data-gtally]'); if (gt) { const [r, pid] = gt.dataset.gtally.split(':'); const list = mxRows().filter((c) => c.role === r); const all = list.every((c) => c.knows.includes(pid)); list.forEach((c) => mxToggle(c.id, pid, !all)); render(); return; }
  const gr = e.target.closest('[data-grp]'); if (gr) { const r = gr.dataset.grp; MXOPEN.has(r) ? MXOPEN.delete(r) : MXOPEN.add(r); render(); return; }
  const mf = e.target.closest('[data-mxf]'); if (mf) { MXF = mf.dataset.mxf; render(); return; }
  const ma = e.target.closest('[data-mxall]'); if (ma) { MXOPEN = ma.dataset.mxall === 'open' ? new Set(MX.map((c) => c.role)) : new Set(); render(); return; }
  if (e.target.closest('[data-mxundo]')) { const x = MXCHG.pop(); if (x) { const c = MX.find((y) => y.id === x.cid); if (x.on) c.knows.splice(c.knows.indexOf(x.pid), 1); else c.knows.push(x.pid); } render(); return; }
  if (e.target.closest('[data-mxreset]')) { MXQ = ''; MXF = 'all'; render(); return; }
  if (e.target.closest('[data-new]')) { NEWM = !NEWM; render(); return; }
  if (NEWM && !e.target.closest('.ncm-ct2-menu')) { NEWM = false; render(); }
});
document.addEventListener('input', (e) => {
  const sec = e.target.closest('[data-esec]'); if (sec) { DIRTY.add(sec.dataset.esec); const n = DIRTY.size;
    document.querySelector('[data-edtab="' + sec.dataset.esec + '"]')?.classList.add('dirty');
    const st = document.querySelector('[data-edst]'); if (st) { st.classList.add('dirty'); st.innerHTML = '<i class="fas fa-circle" style="font-size:7px"></i> Unsaved changes in ' + n + ' section' + (n === 1 ? '' : 's'); } }
});
document.addEventListener('scroll', (e) => {
  const body = e.target.closest?.('.ncm-ct2-edbody'); if (!body) return;
  const top = body.getBoundingClientRect().top; let cur = 'identity';
  body.querySelectorAll('[data-esec]').forEach((x) => { if (x.getBoundingClientRect().top - top < 40) cur = x.dataset.esec; });
  document.querySelectorAll('[data-edtab]').forEach((t) => t.classList.toggle('on', t.dataset.edtab === cur));
}, true);
document.addEventListener('input', (e) => { const q = e.target.closest('[data-mxq]'); if (!q) return; MXQ = q.value; const at = q.selectionStart; render(); const n = document.querySelector('[data-mxq]'); n.focus(); n.setSelectionRange(at, at); });
render();
if (Q.get('esec')) { const b = document.querySelector('.ncm-ct2-edbody'), x = document.querySelector('[data-esec="' + Q.get('esec') + '"]'); if (b && x) b.scrollTop = x.offsetTop - b.offsetTop; }

const link = (k, v, label) => { const q = new URLSearchParams(location.search); if (v === null) q.delete(k); else q.set(k, v); const on = (Q.get(k) ?? null) === v; return `<a class="${on ? 'on' : ''}" href="?${q}">${label}</a>`; };
document.getElementById('bar').innerHTML = `<b>CONTACTS TAB — REDESIGN</b>
  <span>view</span>${link('view', null, 'directory')}${link('view', 'players', 'players')}${link('view', 'groups', 'groups')}${link('view', 'matrix', 'who knows whom')}${link('mxopen', 'all', 'all groups open')}${link('mxf', 'none', 'nobody knows')}
  <span>preset</span>${link('t', null, 'clean-dark')}${link('t', 'clean-light', 'clean-light')}
  <span>state</span>${link('sel', 'queen', 'an alias')}${link('sel', 'dex', 'auto-added')}${link('new', '1', '+ new open')}${link('edit', '1', 'editing')}${link('dirty', '1', 'unsaved')}${link('guard', '1', 'leave guard')}${link('pop', '1', 'pop-out')}`;
</script>
</body>
</html>
