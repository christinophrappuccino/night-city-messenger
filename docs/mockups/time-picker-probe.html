<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Picker Probe</title>
<!--
  Opens the REAL CyberTimePicker (scripts/ui/components/CyberTimePicker.js)
  in a stubbed Foundry Dialog frame against the real core + CPR + module
  cascade, so its palette can be checked in every theme.
    ?t=clean-dark|clean-light|high-contrast   tag it as an admin dialog
                                              (GM view); omit = player theme
    ?h12=1   12-hour clock (AM/PM column)     ?month=number|short|long
    ?fmt=YMD|DMY|MDY
  Serve it: node tools/serve-mockups.cjs  (a file:// page cannot import
  an ES module), or headless with --allow-file-access-from-files.
-->
<script>
  (function () {
    const onDisk = location.protocol === 'file:';
    const vendor = onDisk
      ? ['file:///C:/Program%20Files/Foundry%20Virtual%20Tabletop/resources/app/public/css/foundry2.css',
         'file:///C:/Users/cphan/AppData/Local/FoundryVTT/Data/systems/cyberpunk-red-core/main.css']
      : ['/_vendor/foundry2.css', '/_vendor/cpr.css'];
    for (const href of vendor) {
      const l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = href;
      document.head.appendChild(l);
    }
  }());
</script>
<link rel="stylesheet" href="../../styles/night-city-messenger.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  html, body { margin: 0; background: #2b2f36; }
  .application.dialog { position: absolute; left: 20px; top: 20px; }
</style>
</head>
<body>
<script type="module">
  const sp = new URLSearchParams(location.search);
  const theme = sp.get('t');
  const SETTINGS = {
    timeFormat: sp.get('h12') === '1' ? '12h' : '24h',
    dateFormat: sp.get('fmt') || 'YMD',
    dateMonthStyle: sp.get('month') || 'number',
  };
  globalThis.game = { settings: { get: (_m, k) => SETTINGS[k] }, nightcity: {}, user: { isGM: true } };

  // Minimal v1 Dialog: same frame classes Foundry builds, same render(html) hook.
  globalThis.Dialog = class {
    constructor(data, opts) { this.data = data; this.opts = opts; }
    render() {
      const el = document.createElement('div');
      el.className = ['app', 'window-app', 'dialog', 'application', ...(this.opts.classes || [])].join(' ');
      if (theme) { el.classList.add('ncm-admin-dialog'); el.dataset.ncmAdminTheme = theme; }
      el.style.width = this.opts.width + 'px';
      const btns = Object.entries(this.data.buttons).map(([k, b]) =>
        `<button class="dialog-button ${k}" data-button="${k}">${b.icon} ${b.label}</button>`).join('');
      el.innerHTML = `<header class="window-header flexrow draggable"><h4 class="window-title">${this.data.title}</h4>
        <a class="header-button control close"><i class="fas fa-times"></i>Close</a></header>
        <section class="window-content"><div class="dialog-content">${this.data.content}</div>
        <div class="dialog-buttons">${btns}</div></section>`;
      document.body.appendChild(el);
      this.element = $(el);
      this.data.render?.(this.element);
    }
  };

  try {
    const { CyberTimePicker } = await import('../../scripts/ui/components/CyberTimePicker.js');
    CyberTimePicker.open({ value: '2045-10-12T03:40:00Z', title: 'Message Date', onSet() {} });
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend', `<pre style="color:#f66;padding:20px">${e.message}\nServe this page: node tools/serve-mockups.cjs</pre>`);
    document.title = 'ERR ' + e.message;
  }

  // Report: preview contrast + the spin column vs the hour box it sits beside.
  const pv = document.querySelector('.ncm-ctp-preview-cyber');
  const box = document.querySelector('.ncm-ctp-inp[data-field="hour"]')?.getBoundingClientRect();
  const col = document.querySelector('.ncm-ctp-spin')?.parentElement.getBoundingClientRect();
  if (pv && box && col) {
    document.title = `preview ${getComputedStyle(pv).color} | hour ${Math.round(box.top)}-${Math.round(box.bottom)} spin ${Math.round(col.top)}-${Math.round(col.bottom)}`;
  }
</script>
</body>
</html>
