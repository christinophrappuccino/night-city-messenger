<style>
  :root {
    --ncm-primary: #F65261; --ncm-secondary: #19f3f7; --ncm-accent: #f7c948;
    --ncm-danger: #F65261; --ncm-warning: #f7c948; --ncm-success: #00ff41;
    --ncm-bg-deep: #0a0a12; --ncm-bg-medium: #12121a; --ncm-bg-light: #1a1a2e;
    --ncm-text-primary: #ededf2; --ncm-text-secondary: #b9b9cc; --ncm-text-muted: #7a7a92;
    --ncm-border: #2a2a45;
    --ncm-font-ui: 'Segoe UI', sans-serif; --ncm-font-mono: 'Consolas', monospace;
    --ncm-font-body: 'Segoe UI', sans-serif; --ncm-font-display: 'Segoe UI', sans-serif;
  }
  [data-ct-color="purple"] { --ct-c: #a855f7; }
  body { margin: 0; }
  .stage {
    position: relative; width: 100%; height: 100vh; overflow: hidden;
    background: radial-gradient(circle at 30% 20%, #14142400, #05050a),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px), #05050a;
  }
  .stage__label { position: absolute; top: 12px; left: 16px; font: 700 11px 'Consolas', monospace; letter-spacing: 2px; color: #7a7a92; }
  .stage__reset { position: absolute; top: 10px; right: 16px; font: 700 9px 'Consolas', monospace; letter-spacing: 1px;

<body>
<div class="stage" id="stage">
  <div class="stage__label">UPLOADCONSOLE // real CSS · pick a program → FORGE &amp; UPLOAD</div>
  <button class="stage__reset" onclick="mount()">▶ REPLAY</button>
</div>

<script>
  const PROGRAMS = [
    { name: 'affair.chat', fam: 'plant', icon: 'fa-syringe', label: 'PLANT', dv: 'FORGE DV 15', d: 'forged chat log — fires on the target\'s next login', src: 'shard: "Ghostworks dead-drop"' },
    { name: 'evidence.img', fam: 'plant', icon: 'fa-syringe', label: 'PLANT', dv: 'FORGE DV 17', d: 'doctored gallery — planted "proof"', src: 'shard: "Ghostworks dead-drop"' },
    { name: 'backdoor.exe', fam: 'exe', icon: 'fa-biohazard', label: 'EXECUTE', dv: 'RUN DV 20', d: 'forges a hidden account for later', src: 'my Agent', soon: true },
  ];
  const ACCOUNTS = { admin: 'admin@netwatch', jsilver: 'j.silverhand@netwatch' };
  let selIdx = -1;

  function syncOutcome(panel) {
    const out = panel.querySelector('.ncm-upcon__outcome');
    const whatEl = panel.querySelector('.ncm-upcon__owhat');
    const whenEl = panel.querySelector('.ncm-upcon__owhen');
    if (selIdx < 0) { out.dataset.empty = '1'; whatEl.textContent = 'Pick a program above to preview delivery.'; whenEl.textContent = ''; return; }
    out.dataset.empty = '0';
    const prog = PROGRAMS[selIdx];
    const val = panel.querySelector('.ncm-upcon__acct').value;
    const who = val ? ACCOUNTS[val] : 'anyone';
    whatEl.innerHTML = `<b>${prog.name}</b> lands in <b>${who}</b>'s mailbox`;
    whenEl.innerHTML = val ? `activates the next time <b>${who}</b> logs in` : 'activates on the next login by <b>anyone</b>';
  }

  function mount() {
    selIdx = -1;
    const old = document.querySelector('.ncm-upcon-backdrop'); if (old) old.remove();
    const rows = PROGRAMS.map((p, i) => `
      <button type="button" class="ncm-upcon__item${p.soon ? ' is-soon' : ''}" data-up-idx="${i}" style="--i:${i}"${p.soon ? ' disabled' : ''}>
        <span class="ncm-upcon__ico ncm-upcon__ico--${p.fam}"><i class="fas ${p.icon}"></i></span>
        <span class="ncm-upcon__nm">
          <span class="ncm-upcon__t">${p.name}
            <span class="ncm-upcon__fam ncm-upcon__fam--${p.fam}">${p.label}</span>
            ${p.soon ? '<span class="ncm-upcon__soon">SOON</span>' : ''}</span>
          <span class="ncm-upcon__d">${p.d}</span>
          <span class="ncm-upcon__src"><i class="fas fa-sd-card"></i> ${p.src}</span>
        </span>
        <span class="ncm-upcon__dv">${p.dv}</span>
      </button>`).join('');
    const wrap = document.createElement('div');
    wrap.className = 'ncm-upcon-backdrop';
    wrap.innerHTML = `
      <div class="ncm-upcon" role="dialog" data-ct-color="purple">
        <div class="ncm-upcon__bar"></div>
        <span class="ncm-upcon__ck ncm-upcon__ck--tl"></span><span class="ncm-upcon__ck ncm-upcon__ck--tr"></span>
        <span class="ncm-upcon__ck ncm-upcon__ck--bl"></span><span class="ncm-upcon__ck ncm-upcon__ck--br"></span>
        <div class="ncm-upcon__hd">
          <span class="ncm-upcon__tag"><i class="fas fa-upload"></i> UPLOAD</span>
          <span class="ncm-upcon__sub">push a carried program onto NETWATCH-UNIT</span>
        </div>
        <div class="ncm-upcon__list">${rows}</div>
        <div class="ncm-upcon__deliver">
          <div class="ncm-upcon__dhd"><i class="fas fa-crosshairs"></i> DELIVERY<span class="ncm-upcon__dhint">where it lands · when it fires</span></div>
          <div class="ncm-upcon__drow">
            <span class="ncm-upcon__dlbl">TARGET</span>
            <select class="ncm-upcon__acct"><option value="admin">admin@netwatch</option><option value="jsilver">j.silverhand@netwatch</option><option value="">— any login —</option></select>
          </div>
          <div class="ncm-upcon__outcome" data-empty="1">
            <span class="ncm-upcon__oline"><i class="fas fa-inbox"></i> <span class="ncm-upcon__owhat">Pick a program above to preview delivery.</span></span>
            <span class="ncm-upcon__oline ncm-upcon__oline--when"><i class="fas fa-clock"></i> <span class="ncm-upcon__owhen"></span></span>
          </div>
        </div>
        <div class="ncm-upcon__compile"><div class="ncm-upcon__crow"><span class="ncm-upcon__cline"></span><span class="ncm-upcon__ctx">COMPILING PAYLOAD…</span></div><div class="ncm-hackfx"></div></div>
        <div class="ncm-upcon__ft">
          <button type="button" class="ncm-upcon__cancel">CANCEL</button>
          <button type="button" class="ncm-upcon__go" disabled><i class="fas fa-fingerprint"></i> FORGE &amp; UPLOAD</button>
        </div>
      </div>`;
    const panel = wrap.querySelector('.ncm-upcon');
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap || e.target.closest('.ncm-upcon__cancel')) { mount(); return; }
      const item = e.target.closest('.ncm-upcon__item');
      if (item && !item.disabled) {
        selIdx = Number(item.dataset.upIdx);
        panel.querySelectorAll('.ncm-upcon__item').forEach(el => el.classList.toggle('is-sel', el === item));
        panel.querySelector('.ncm-upcon__go').disabled = false;
        syncOutcome(panel);
        return;
      }
      const go = e.target.closest('.ncm-upcon__go');
      if (go && !go.disabled) {
        panel.classList.add('is-compiling');
        const fam = PROGRAMS[selIdx].fam === 'exe' ? 'execute' : 'plant';
        streamHackCode(panel.querySelector('.ncm-hackfx'), { subject: PROGRAMS[selIdx].name, family: fam, durationMs: 1150,
          onDone: () => { panel.querySelector('.ncm-upcon__ctx').textContent = 'HANDING OFF TO FORGE ROLL →'; } });
      }
    });
    wrap.addEventListener('change', (e) => { if (e.target.closest('.ncm-upcon__acct')) syncOutcome(panel); });
    document.getElementById('stage').appendChild(wrap);
    syncOutcome(panel);
    if (location.hash === '#compile' || location.hash === '#select') {
      const first = wrap.querySelector('.ncm-upcon__item:not(.is-soon)');
      selIdx = Number(first.dataset.upIdx); first.classList.add('is-sel');
      wrap.querySelector('.ncm-upcon__go').disabled = false; syncOutcome(panel);
      if (location.hash === '#compile') setTimeout(() => wrap.querySelector('.ncm-upcon__go').click(), 350);
    }
  }

  // Inline copy of HackFX.streamHackCode (the shipping module version is identical).
  const HEX = '0123456789ABCDEF';
  const rhex = (n) => { let s = ''; for (let i = 0; i < n; i++) s += HEX[(Math.random() * 16) | 0]; return s; };
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const SHARED = ['linking payload.o','resolving symbols','patching checksum 0x@','obfuscating strings','signing manifest','zeroing slack space','spoofing timestamps','stripping debug syms','packing .text 0x@','seeding entropy pool','aligning segments 0x@','scrubbing metadata','faking cert chain','relocating 0x@ → 0x@','deflating resources','remapping imports','encrypting body // rc4','rewriting entrypoint 0x@'];
  const FAM_STEPS = {
    plant: ['forging document header','aging timestamps → §','synthesizing sender headers','matching writing cadence','planting EXIF trail 0x@','backdating record §','compositing image layers','weaving conversation graph','laundering provenance','minting message-id 0x@','stitching reply chain','normalizing font metrics'],
    execute: ['assembling shellcode','building ROP chain 0x@','patching syscall table','injecting §','hooking IAT 0x@','escalating privileges','disabling watchdog','opening reverse shell','mapping RWX page 0x@','planting persistence key','unhooking EDR','staging dropper §'],
  };
  const WARN = ['⚠ heuristic flag suppressed','⚠ signature mismatch — patching','⚠ ICE probe detected — cloaking','⚠ checksum drift 0x@','⚠ AV hook bypassed','⚠ trace ping — scrubbing route'];
  const OK_LINE = { plant: '✓ forgery sealed — uploading…', execute: '✓ binary armed — uploading…', default: '✓ payload compiled — forging…' };
  function streamHackCode(el, { durationMs = 1150, subject = 'payload', family = '', onDone } = {}) {
    if (!el) { onDone && onDone(); return; }
    const fam = FAM_STEPS[family] ? family : '';
    const fill = (s) => { while (s.includes('0x@')) s = s.replace('0x@', '0x' + rhex(8)); return s.replace('§', subject); };
    const hexRow = () => `${rhex(4)}:  ${rhex(2)} ${rhex(2)} ${rhex(2)} ${rhex(2)}  ${rhex(2)} ${rhex(2)} ${rhex(2)} ${rhex(2)}`;
    const add = (txt, cls) => { const d = document.createElement('div'); d.className = 'ncm-hackfx__ln' + (cls ? ' ' + cls : ''); d.textContent = txt; el.appendChild(d); el.scrollTop = el.scrollHeight; while (el.childElementCount > 60) el.firstElementChild.remove(); };
    const gen = () => { const r = Math.random(); if (r < 0.08) return { txt: fill(pick(WARN)), cls: 'is-warn' }; if (r < 0.34) return { txt: hexRow(), cls: 'is-hex' }; const fp = FAM_STEPS[fam]; const pool = (fp && Math.random() < 0.6) ? fp : SHARED; return { txt: '→ ' + fill(pick(pool)), cls: 'is-step' }; };
    const start = Date.now(); let done = false;
    const iv = setInterval(() => { if (done) return; const { txt, cls } = gen(); add(txt, cls); if (Date.now() - start >= durationMs) { done = true; clearInterval(iv); add(OK_LINE[fam] || OK_LINE.default, 'is-ok'); onDone && onDone(); } }, 55);
  }

  mount();
</script>
</body>
