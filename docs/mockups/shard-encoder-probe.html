<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NCM — Shard Encoder probe (REAL app, JS-built DOM)</title>
<!--
  The Encoder builds its DOM in JS (ShardEncoderApp._mount), so a template probe
  renders an empty shell. This page stubs just enough of Foundry to import the REAL
  app module, construct it, and mount it into the REAL cascade (core → CPR → module),
  which is the only way the borrowed `.ncm-fw-*` Workshop rules are in play.

    ?stage=blank|content|program|lock|encode   which stage to mount (default blank)
    ?rolled=<n>                   pretend the Cryptography ceiling roll came up n
    ?onlyknown=1 / ?srcq=<text> / ?srctype=<item type>   the blank list's filters + search
    ?type=<content type>          pick a content type on the Content stage
    ?wrote=1 [&files=2]           pretend the player already wrote file(s)
    ?lg=<json>                    legibility prefs, e.g. ?lg={"textScale":140,"outlines":true}
    ?preset=large|contrast|calm|max   apply a named legibility preset instead
    ?display=1                    open the Display popover
    ?icon=1                       open the chip designer
    ?h=<px>                       frame height

  Run Chrome with --allow-file-access-from-files (ES module import over file://).
-->
<link rel="stylesheet" href="file:///C:/Program%20Files/Foundry%20Virtual%20Tabletop/resources/app/public/css/foundry2.css">
<link rel="stylesheet" href="file:///C:/Users/cphan/AppData/Local/FoundryVTT/Data/systems/cyberpunk-red-core/main.css">
<link rel="stylesheet" href="../../styles/night-city-messenger.css">
<link rel="stylesheet" href="file:///C:/Program%20Files/Foundry%20Virtual%20Tabletop/resources/app/public/fonts/fontawesome/css/all.min.css">
<style>
  body { margin: 0; padding: 12px; background: #1c1c22; }
  .probe-label { color: #cfe; font: 11px/1.5 monospace; margin-bottom: 8px; white-space: pre; }
  /* ?bare=1 hides the report so the window can be captured on its own */
  body.bare .probe-label { display: none; }
  #app { position: relative !important; inset: auto !important; width: 1060px; height: 690px; display: flex; flex-direction: column;
         border-radius: 4px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.55); }
  #app > .window-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0; background: none; }
</style>
</head>
<body>
<div class="probe-label" id="lbl">loading…</div>
<script>if (new URLSearchParams(location.search).get('bare') === '1') document.body.classList.add('bare');</script>
<div class="application ncm-app ncm-malware-workshop ncm-shard-encoder" id="app">
  <header class="window-header"><h1 class="window-title">Shard Encoder</h1><button class="header-control fa-solid fa-xmark"></button></header>
  <section class="window-content"><div class="ncm-fw ncm-enc" id="encRoot" data-enc-stage="blank"></div></section>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('h')) document.getElementById('app').style.height = q.get('h') + 'px';

  // ── Foundry stubs (only what module load + _mount touch) ──
  class ApplicationV2 {
    constructor(o = {}) { this.options = o; }
    get element() { return this._el; } set element(v) { this._el = v; }
    get rendered() { return true; } get animationsEnabled() { return true; }
    setPosition() {} render() {} close() {} _onRender() {}
  }
  window.foundry = {
    applications: { api: { ApplicationV2, HandlebarsApplicationMixin: (B) => B }, instances: new Map() },
    utils: {
      mergeObject: (a, b, o = {}) => Object.assign(o.inplace === false ? structuredClone(a) : a, b),
      deepClone: (o) => structuredClone(o), randomID: (n = 16) => Math.random().toString(36).slice(2, 2 + n),
      getRoute: (p) => p, debounce: (fn) => fn, throttle: (fn) => fn, duplicate: (o) => structuredClone(o),
      getProperty: (o, p) => p.split('.').reduce((a, k) => a?.[k], o),
      setProperty: (o, p, v) => { const ks = p.split('.'); const l = ks.pop(); ks.reduce((a, k) => (a[k] ??= {}), o)[l] = v; return true; },
      escapeHTML: (s) => String(s), expandObject: (o) => o, flattenObject: (o) => o, isEmpty: (o) => !o,
    },
  };

  // a small pretend world: an operator with skills and two blanks in their gear
  const PRESETS = { large: { textScale: 130, density: 'roomy' }, contrast: { contrast: 130, outlines: true },
                    calm: { motion: 'calm', plainFont: true },
                    max: { textScale: 140, contrast: 130, motion: 'off', density: 'roomy', outlines: true, plainFont: true, details: true } };
  let lg = {};
  try { lg = q.get('lg') ? JSON.parse(q.get('lg')) : (PRESETS[q.get('preset')] || {}); } catch (e) { lg = {}; }
  // --virtual-time-budget advances JS timers but NOT CSS animations, so an entrance
  // cascade is captured frozen at opacity 0. ?still=1 turns motion off for the shot.
  if (q.get('still') === '1') lg.motion = 'off';

  const mkItem = (name, img, type = 'gear') => ({
    id: 'i-' + name.replace(/\W/g, ''), name, type, img, isOwner: true,
    getFlag: () => null, setFlag: async () => {}, update: async () => {},
  });
  const gear = [mkItem('Blank Data Shard', 'icons/commodities/tech/blade-tool-green.webp'),
                mkItem('Militech Hardened Shard', 'icons/commodities/tech/tube-chip-gold.webp'),
                mkItem('Braindance wafer', 'icons/commodities/tech/cog-steel.webp'),
                // a realistic amount of clutter, so the search has a job
                mkItem('Medtech bag', 'icons/svg/item-bag.svg'),
                mkItem('Grapple hand', 'icons/svg/item-bag.svg', 'cyberware'),
                mkItem('Neural Link', 'icons/svg/item-bag.svg', 'cyberware'),
                mkItem('Techscanner', 'icons/svg/item-bag.svg'),
                mkItem('Agent (Old Model)', 'icons/svg/item-bag.svg'),
                mkItem('Very Heavy Pistol', 'icons/svg/item-bag.svg', 'weapon'),
                mkItem('Road flare', 'icons/svg/item-bag.svg'),
                mkItem('Light Armorjack', 'icons/svg/item-bag.svg', 'armor'),
                mkItem('Memory chip (used)', 'icons/svg/item-bag.svg')];
  const actor = {
    id: 'a1', name: 'V', isOwner: true,
    system: { wealth: { value: 1250, transactions: [] } },
    items: { contents: gear, get: (id) => gear.find((i) => i.id === id) },
  };

  const settings = {
    encoderConfig: {
      enabled: true,
      tiers: [
        { id: 'scrap', name: 'Scrap', color: 'muted', price: 0, buyable: false, fallback: true, onRejected: 'bricked', onNat1: 'bricked-trace', perk: '', capacity: 1, items: [] },
        { id: 'standard', name: 'Standard', color: 'cyan', price: 50, buyable: true, onRejected: 'bricked', onNat1: 'bricked-trace', perk: '', capacity: 3, items: [{ name: 'Blank Data Shard' }] },
        { id: 'premium', name: 'Premium', color: 'gold', price: 200, buyable: true, onRejected: 'survives', onNat1: 'bricked', perk: 'craft+1', capacity: 8, items: [{ name: 'Militech Hardened Shard' }] },
      ],
    },
    legibilityPrefs: lg,
    // The GM's saved shard looks, offered on the Look row (?looks=0 to hide them).
    shardThemePresets: q.get('looks') === '0' ? [] : [
      { name: 'Arasaka internal', theme: { basePreset: 'corporate-dossier', colors: { secondary: '#ee3030', accent: '#e0b040', bgSurface: '#120a0a' }, fonts: {} } },
      { name: 'Afterlife dead drop', theme: { basePreset: 'fixer-dead-drop', colors: { secondary: '#e070ff', accent: '#ff60b0', bgSurface: '#120e18' }, fonts: {} } },
      { name: 'Clean slate', theme: { colors: { secondary: '#8be9a0' }, fonts: {} } },
    ],
  };
  const RANKS = { Interface: 5, 'Electronics/Security Tech': 3, Cryptography: 2, Forgery: 4, 'Library Search': 3, Accounting: 1, Perception: 2 };
  const STATS = { Interface: ['tech', 7], 'Electronics/Security Tech': ['tech', 7], Cryptography: ['int', 6], Forgery: ['tech', 7], 'Library Search': ['int', 6], Accounting: ['int', 6], Perception: ['int', 6] };

  window.game = {
    user: { isGM: false, id: 'p1', character: actor }, userId: 'p1',
    users: { activeGM: { id: 'gm' }, contents: [] },
    settings: { get: (m, k) => settings[k], set: async (m, k, v) => { settings[k] = v; }, register() {} },
    actors: { contents: [actor], filter: () => [], get: () => actor },
    items: { contents: [], get: () => null },
    documentTypes: { Item: ['gear'] },
    i18n: { localize: (s) => s, format: (s) => s },
    nightcity: {
      settingsManager: { getEncoderConfigRaw: () => settings.encoderConfig, getTheme: () => ({}) },
      dataShardService: { getAllPresets: () => [
        { key: 'blank', label: 'Blank', icon: 'fas fa-microchip' },
        { key: 'corporate-dossier', label: 'Corporate Dossier', icon: 'fas fa-building' },
        { key: 'black-market', label: 'Black Market', icon: 'fas fa-skull-crossbones' },
        { key: 'medical', label: 'Medical Record', icon: 'fas fa-notes-medical' },
      ] },
      skillService: { getSkillData: (a, name) => ({ skillLevel: RANKS[name] ?? 0, statName: (STATS[name] || ['int', 5])[0], statValue: (STATS[name] || ['int', 5])[1], found: true }) },
      timeService: { getCurrentTime: () => new Date().toISOString() },
      eventBus: { on: () => ({ unsubscribe() {} }), emit() {} },
    },
  };
  window.Hooks = { on() {}, once() {}, off() {}, call() {}, callAll() {} };
  window.__ncmMsgs = [];
  window.ui = { notifications: { info(m) { window.__ncmMsgs.push("i:" + m); }, warn(m) { window.__ncmMsgs.push("w:" + m); }, error(m) { window.__ncmMsgs.push("e:" + m); } }, windows: {}, items: { render() {} } };
  window.CONFIG = {}; window.Dialog = class {}; window.Item = { create: async () => null };
  // The real content-body partial needs Foundry's Handlebars pipeline, which this page
  // does not have. Stub it so the preview panel shows SOMETHING recognisable in a shot;
  // the app's own fallback message is what you'd see without this.
  window.renderTemplate = async (path, ctx) => `<div style="font:12px/1.6 var(--ncm-font-body,sans-serif);color:var(--ncm-text-secondary,#9fb3c0)">
    <div style="font:700 14px var(--ncm-font-display,sans-serif);color:var(--ncm-text-primary,#e8f4f8);margin-bottom:6px">${ctx?.subject || ''}</div>
    <div style="font:10px var(--ncm-font-mono,monospace);color:var(--ncm-text-muted,#7a8b99);margin-bottom:10px">${ctx?.contentTypeLabel || ''} · ${ctx?.from || ''}</div>
    ${(ctx?.contentData?.paragraphs || []).map((p) => `<p><b style="color:var(--ncm-text-primary,#e8f4f8)">${p.heading || ''}</b><br>${p.text || ''}</p>`).join('')}
    <p style="font-style:italic;color:var(--ncm-text-muted,#7a8b99)">[probe stub — the real partial renders here in Foundry]</p></div>`;
</script>
<script type="module">
  const lbl = document.getElementById('lbl');
  const q = new URLSearchParams(location.search);
  try {
    const { ShardEncoderApp } = await import('../../scripts/ui/ShardEncoder/ShardEncoderApp.js');
    // A stage past BLANK needs a blank in hand — pass the item, exactly as the
    // right-click door does, or the constructor sends you back to stage 1.
    const stage = q.get('stage') || 'blank';
    const seed = stage === 'blank' ? null : window.game.actors.get().items.get('i-BlankDataShard');
    const app = new ShardEncoderApp({
      actor: window.game.actors.get(),
      stage: stage === 'content' ? 'program' : stage,   // both are the one 'build' slot
      item: seed,
      family: (stage === 'program' || q.get('family')) ? (q.get('family') || 'execute') : undefined,
    });
    // ?dressed=1 — blank stage with a blank already chosen, so the Look row
    // (art, built-in looks, the GM's saved looks, startup) is what you see.
    if (stage === 'blank' && q.get('dressed')) {
      const blank = window.game.actors.get().items.get('i-BlankDataShard');
      app.S.itemId = blank?.id || '';
      app.S.label = blank?.name || 'Blank Data Shard';
      app.S.dec = q.get('dec') || 'look';
      if (q.get('preset')) app.S.preset = q.get('preset');
      if (q.get('look')) app.S.savedLook = q.get('look');
      // ?mix=1 — open the custom-look mixer with a started look.
      if (q.get('mix')) { app.S.customLook = { secondary: '#00ff41', bgDeep: '#080a08' }; app.S.customOpen = true; }
    }
    if (stage === 'content' || q.get('type')) {
      app.S.mode = 'content';
      app.S.type = q.get('type') || 'document';
      app.S.dec = q.get('dec') || 'type';
    }
    if (q.get('wrote') === '1') {
      app.S.mode = 'content';
      app.S.type = app.S.type || q.get('type') || 'document';
      app.S.entries = [{
        contentType: app.S.type || 'document', subject: 'Kang Tao — Q3 payroll adjustment',
        from: 'm.sato@kangtao.corp', body: 'Retroactive adjustments, effective immediately.',
        contentData: { docType: 'MEMO', classification: 'INTERNAL', paragraphs: [
          { heading: 'SUMMARY', text: 'Per the Q3 review, the following personnel receive retroactive adjustments.' },
          { heading: 'AUTHORISED BY', text: 'M. Sato, Night City branch.' }] },
      }];
      // ?files=2 seeds a second file so the stack DV and the list can be seen
      if (Number(q.get('files')) > 1) {
        app.S.entries.push({ contentType: 'dossier', subject: 'Subject file — R. Delgado',
          contentData: { targetName: 'R. Delgado', classification: 'INTERNAL', sections: [] } });
      }
      app.S.dec = q.get('dec') || 'sk';
    }
    const root = document.getElementById('app');
    app.element = root;
    if (seed) app.S.label = 'Kang Tao payroll';
    if (stage === 'encode' || stage === 'lock') app.S.stage = stage;
    if (q.get('rolled')) {
      app.S.lock.cryptoTotal = Number(q.get('rolled'));
      app.S.lock.gateTotal = Number(q.get('rolled'));
      app.S.lock.encrypted = true;
      app.S.lock.dv = 15;
      app.S.lock.password = 'ronin-chrome-42';
    }
    app._mount();
    if (q.get('dec')) { app.S.dec = q.get('dec'); app._renderRail({ enter: false }); }
    if (q.get('srctype')) { app.S.srcType = q.get('srctype'); app._renderRail({ enter: false }); }
    if (q.get('onlyknown') === '1') { app.S.srcOnlyKnown = true; app._renderRail({ enter: false }); }
    if (q.get('srcq')) { app.S.srcSearch = q.get('srcq'); app._renderRail({ enter: false }); }
    if (q.get('display') === '1') app._toggleLg(true);
    if (q.get('icon') === '1') app._designImage();
    // Foundry serves 'systems/…' from its data root; this page cannot, so point
    // the shard art at the real files (probe-only — the app uses the real path).
    const sysRoot = 'file:///C:/Users/cphan/AppData/Local/FoundryVTT/Data/systems/';
    const fixArt = () => document.querySelectorAll('img[src^="systems/"]').forEach((im) => {
      im.src = sysRoot + im.getAttribute('src').slice('systems/'.length);
    });
    fixArt();
    new MutationObserver(fixArt).observe(root, { childList: true, subtree: true });
    // ?sealed=clean|sloppy — paint the finished state, market card and all.
    if (q.get('sealed')) {
      const outcome = q.get('sealed');
      const dv = app._dv() || 15;
      const eff = outcome === 'sloppy'
        ? { rung: 'sloppy', margin: -2, quality: 34, scanDV: 10, tell: 'FORGED', charges: 1, stealthDV: 8, runDV: dv + 2 }
        : { rung: 'clean', margin: 4, quality: 82, scanDV: 16, tell: '', charges: 2, stealthDV: 16, runDV: dv - 2 };
      app.S.result = { outcome, eff, botch: { short: 'bricked', bricks: true }, total: dv + eff.margin,
                       dv, margin: eff.margin, rolled: true, saved: { ok: true } };
      app._seal(app.S.result);
    }

    // ── diagnostics: contrast, overflow, and the legibility stamps ──
    const enc = document.getElementById('encRoot');
    const cs = getComputedStyle(enc);
    const lum = (c) => { const m = c.match(/\d+(\.\d+)?/g); if (!m || m.length < 3) return null; const [r, g, b] = m.map(Number); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };
    const bgOf = (el) => { let e = el; while (e && e !== document.body) { const bg = getComputedStyle(e).backgroundColor; if (bg && !bg.startsWith('rgba(0, 0, 0, 0)') && bg !== 'transparent' && !bg.startsWith('color(')) return bg; e = e.parentElement; } return 'rgb(28,28,34)'; };
    let bad = 0, checked = 0; const samples = [];
    for (const el of enc.querySelectorAll('*')) {
      if (!el.textContent.trim() || el.children.length) continue;
      const s = getComputedStyle(el);
      if (s.display === 'none' || s.visibility === 'hidden' || el.closest('[hidden]')) continue;
      const lt = lum(s.color), lb = lum(bgOf(el));
      if (lt === null || lb === null) continue;
      checked++;
      if (Math.abs(lt - lb) < 0.22) { bad++; if (samples.length < 6) samples.push(`${el.className || el.tagName}: ${s.color} on ${bgOf(el)}`); }
    }
    const overflow = [...enc.querySelectorAll('*')].filter((el) => el.scrollWidth > el.clientWidth + 2 && getComputedStyle(el).overflowX === 'hidden')
      .slice(0, 4).map((el) => el.className);
    const sample = enc.querySelector('.ncm-enc-dec__v') || enc.querySelector('.ncm-enc-stage__t');
    const lines = [
      `stage=${app.S.stage}  prefs=${JSON.stringify(app._lg)}`,
      `--ncm-text-scale=${cs.getPropertyValue('--ncm-text-scale').trim()}  --ncm-lg-text=${cs.getPropertyValue('--ncm-lg-text').trim()}`,
      `motion=${enc.dataset.lgMotion} density=${enc.dataset.lgDensity} outlines=${enc.dataset.lgOutlines} font=${enc.dataset.lgFont}`,
      `sample text size=${sample ? getComputedStyle(sample).fontSize : 'n/a'}  rail bg=${getComputedStyle(enc.querySelector('.ncm-fw-rail')).backgroundColor}`,
      `low-contrast text nodes: ${bad}/${checked}`,
      overflow.length ? `CLIPPED: ${overflow.join(' | ')}` : 'no clipped nodes',
      ...samples,
    ];
    lbl.textContent = lines.join('\n');
    if (window.__ncmMsgs?.length) lbl.textContent += String.fromCharCode(10) + 'notifications: ' + window.__ncmMsgs.join(' / ');
    document.title = 'PROBE ' + lines.slice(0, 5).join(' | ');
  } catch (e) {
    lbl.textContent = 'ERROR ' + (e.stack || e.message);
    document.title = 'PROBE ERROR ' + e.message;
  }
</script>
</body>
</html>
