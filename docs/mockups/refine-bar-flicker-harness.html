<!doctype html>
<html><head>
<meta charset="utf-8">
<title>Refine-bar flicker harness</title>
<link rel="stylesheet" href="file:///C:/Program%20Files/Foundry%20Virtual%20Tabletop/resources/app/public/css/foundry2.css">
<link rel="stylesheet" href="file:///C:/Users/cphan/AppData/Local/FoundryVTT/Data/systems/cyberpunk-red-core/main.css">
<link rel="stylesheet" href="../../styles/night-city-messenger.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { margin: 0; background: #0a0a12; }
  #hud {
    position: fixed; top: 4px; right: 8px; z-index: 9999; color: #0f0;
    font: 12px monospace; background: rgba(0,0,0,.75); padding: 6px 10px;
    pointer-events: none; white-space: pre; text-align: right;
  }
  .harness-frame { width: 560px; margin: 40px; height: 480px; position: relative; }
</style>
</head><body>
<div id="hud">idle</div>
<div class="application ncm-app harness-frame">
  <div class="window-content" style="display:flex; padding:0;">
    <div class="ncm-viewer" style="display:flex; flex-direction:column; width:100%;">
      <div class="ncm-viewer__split" style="display:flex; flex:1;">
        <div class="ncm-viewer__list-panel" style="width:320px; display:flex; flex-direction:column;">
          <div class="ncm-viewer__refine-bar">
            <div class="ncm-viewer__refine-controls">
              <span class="ncm-viewer__date-filter" data-action="open-date-picker" id="dates">
                <i class="fas fa-calendar-days"></i> Dates <i class="fas fa-caret-down"></i>
              </span>
              <span class="ncm-viewer__sort-btn" data-action="toggle-sort-dropdown" id="sort">
                <i class="fas fa-arrow-down-short-wide"></i> Newest <i class="fas fa-caret-down"></i>
                <div class="ncm-sort-dropdown ncm-hidden" id="sortDrop">
                  <div class="ncm-sort-option ncm-sort-option--active" data-action="set-sort">Newest</div>
                  <div class="ncm-sort-option" data-action="set-sort">Oldest</div>
                  <div class="ncm-sort-option" data-action="set-sort">Unread first</div>
                </div>
              </span>
              <span class="ncm-viewer__filter-trigger" data-action="toggle-filter-dropdown" id="filters">
                <i class="fas fa-filter"></i> Filters <i class="fas fa-caret-down"></i>
              </span>
              <div class="ncm-viewer__density-trigger" data-action="toggle-density-dropdown" id="density">
                <i class="fas fa-list"></i>
                <i class="fas fa-caret-down" style="font-size: 7px; opacity: 0.5;"></i>
              </div>
            </div>
          </div>
          <div class="ncm-viewer__msg-list" id="list">
            <div class="ncm-viewer__msg" id="row1"><div style="min-width:0">Row one — subject line preview text</div></div>
            <div class="ncm-viewer__msg ncm-viewer__msg--unread"><div style="min-width:0">Row two — unread message here</div></div>
            <div class="ncm-viewer__msg"><div style="min-width:0">Row three — another subject</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
// Live flicker instrumentation: count hover flips per element; a genuine
// flicker loop shows dozens of enter/leave pairs while the mouse is STILL.
const counts = {};
const hud = document.getElementById('hud');
let last = 'idle';
function wire(id) {
  const el = document.getElementById(id);
  counts[id] = { enter: 0, leave: 0 };
  el.addEventListener('mouseenter', () => { counts[id].enter++; last = id + ' enter'; paint(); });
  el.addEventListener('mouseleave', () => { counts[id].leave++; last = id + ' leave'; paint(); });
}
['dates', 'sort', 'filters', 'density', 'row1'].forEach(wire);
// The sort button toggles its dropdown like the real app (DOM-only).
document.getElementById('sort').addEventListener('click', (ev) => {
  if (!ev.target.closest('.ncm-sort-option')) {
    document.getElementById('sortDrop').classList.toggle('ncm-hidden');
  }
});
function paint() {
  hud.textContent = Object.entries(counts)
    .map(([k, v]) => `${k}: ${v.enter}/${v.leave}`)
    .join('\n') + '\n' + last;
}
paint();
</script>
</body></html>
