# Builds a Foundry-installable release when a version tag (v*) is pushed.
#
# Flow: tag v1.0.0 → this workflow stamps module.json's version/download for
# that tag, zips the module (dev/ and repo-only files excluded; docs/ ships the guide), and attaches
# module.json + module.zip to a GitHub release. Foundry's "latest" manifest
# URL (module.json's `manifest` field) then always resolves to the newest
# release, while each release's `download` pins its own zip.
#
# This is release packaging only — it is NOT a build step. The repo remains
# directly loadable by Foundry as-is.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        run: |
          TAG="${GITHUB_REF_NAME}"            # e.g. v1.0.0
          VERSION="${TAG#v}"                  # e.g. 1.0.0
          # `manifest` is the STABLE latest-release URL (what Foundry polls for updates);
          # `download` pins this tag's zip. Both are stamped so the committed module.json
          # can never drift from what a release actually serves.
          jq --arg version "$VERSION" \
             --arg manifest "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json" \
             --arg download "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.json.tmp
          mv module.json.tmp module.json
          jq -r '"version=\(.version)  manifest=\(.manifest)  download=\(.download)"' module.json

      - name: Tag must match module.json's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(jq -r .version module.json)"
          if [ "$TAG" != "$FILE" ]; then echo "tag v$TAG but module.json says $FILE"; exit 1; fi

      - name: Build the macro packs (LevelDB, with Foundry's own LevelDB library)
        run: |
          npm install --no-save --no-package-lock classic-level@1.4.1
          node dev/tools/gen-macros.cjs --require-ldb
          rm -f packs/ncm-macros-player/LOCK packs/ncm-macros-gm/LOCK

      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json \
            LICENSE \
            README.md \
            docs \
            scripts \
            styles \
            templates \
            assets \
            languages \
            packs/ncm-macros-player \
            packs/ncm-macros-gm

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
